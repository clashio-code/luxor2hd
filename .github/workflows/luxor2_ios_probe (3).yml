            va_list ap; long arg; int r;
            va_start(ap, cmd); arg = va_arg(ap, long); va_end(ap);
            if (cmd == 4) {   /* F_SETFL: O_NONBLOCK 0x4->Linux, O_APPEND 0x8->Linux */
              long f = arg & ~0xCL;
              if (arg & 0x4) f |= O_NONBLOCK;
