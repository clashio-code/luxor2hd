          static const char *hint_for(const char *n) {
            int i; const char *m = n[0] == '_' ? n + 1 : n;
            for (i = 0; darwin_hint[i].name; i++) if (!strcmp(darwin_hint[i].name, n) || !strcmp(darwin_hint[i].name, m)) return darwin_hint[i].hint;
            return NULL;
          }
          static const char *risk_for(const char *n) {
            int i; const char *m = n[0] == '_' ? n + 1 : n;
            for (i = 0; risky[i].pfx; i++) if (strncmp(m, risky[i].pfx, strlen(risky[i].pfx)) == 0) return risky[i].why;
            return NULL;
          }

          static int is_crt_lib(const char *l) {
            return !strncmp(l, "libSystem", 9) || !strncmp(l, "libgcc_s", 8) || !strncmp(l, "libstdc++", 9) || !strncmp(l, "libc++", 6);
          }
          static int cmp_sym(const void *a, const void *b) { return strcmp(*(char *const *)a, *(char *const *)b); }
          static int cmp_sym_kc(const void *a, const void *b) { return strcmp((const char *)a, (const char *)b); }

          static void classify(void *h_gles1, void *h_gles2, void *h_mali, void *h_gl4es) {
            int i, nundef = 0;
            const char *objc_cls[MAXSYM], *objc_rt[MAXSYM];
            int n_objc_cls = 0, n_objc_rt = 0;
            int n_ok = 0, n_risk = 0, n_miss = 0, n_hint = 0;
            const char *l_ok[MAXSYM], *l_risk[MAXSYM], *l_miss[MAXSYM];
            struct { char lib[64]; int n; } fw[MAXDYL]; int nfw = 0;
            int gl_total = 0, gl_any = 0, gl_none = 0;

            P("\n== bind ==\n");
            if (have_dyld) {
              P("  dyld_info: rebase(%u B) bind(%u B) weak(%u B) lazy(%u B) export(%u B)\n", dyld_info[1], dyld_info[3], dyld_info[5], dyld_info[7], dyld_info[9]);
              P("  rebase kosong -> %s\n", dyld_info[1] == 0 ? "tidak ada relokasi: binary HARUS di alamat aslinya" : "ada relokasi");
              parse_binds(dyld_info[2], dyld_info[3], 0);
              parse_binds(dyld_info[4], dyld_info[5], 2);   /* weak_bind_off = idx 4 */
              parse_binds(dyld_info[6], dyld_info[7], 1);
            } else P("  tidak ada LC_DYLD_INFO (binary lama?) - perlu parser symtab+indirect, belum didukung probe ini\n");
            if (have_dysym) nundef = (int)dysym[5];
            P("  total titik bind=%d  simbol unik=%d  (undefined di symtab=%d)\n", nbinds, nusym, nundef);
            P("  titik bind per section:\n");
            for (i = 0; i < nsec; i++) if (secbinds[i]) P("    %-20s %d\n", secs[i].name, secbinds[i]);

            for (i = 0; i < nusym; i++) {
              const USym *u = &usyms[i];
              const char *lib = (u->ord >= 1 && u->ord <= ndyl) ? base_name(dylibs[u->ord - 1]) : (u->ord == 0 ? "(self/weak)" : "(flat)");
              const char *n = u->name;
              if (!strncmp(n, "_OBJC_", 6)) { objc_cls[n_objc_cls++] = n; continue; }
              if (!strncmp(lib, "libobjc", 7) || !strncmp(n, "__objc_", 7) || !strncmp(n, "___objc_", 8)) { objc_rt[n_objc_rt++] = n; continue; }
              if (is_crt_lib(lib) || !strcmp(lib, "(self/weak)")) {
                const char *m = n[0] == '_' ? n + 1 : n;
                if (hint_for(n)) { l_miss[n_miss++] = n; n_hint++; continue; }
                if (risk_for(n) && dlsym(RTLD_DEFAULT, m)) { l_risk[n_risk++] = n; continue; }
                if (dlsym(RTLD_DEFAULT, m)) { l_ok[n_ok++] = n; continue; }
                l_miss[n_miss++] = n;
                continue;
              }
              {
                int k;
                for (k = 0; k < nfw; k++) if (!strcmp(fw[k].lib, lib)) break;
                if (k == nfw && nfw < MAXDYL) { strncpy(fw[nfw].lib, lib, 63); fw[nfw].lib[63] = 0; fw[nfw].n = 0; nfw++; }
                if (k < MAXDYL) fw[k].n++;
              }
            }

            P("\n=== klasifikasi simbol libSystem/libgcc_s/libstdc++ ===\n");
            P("  aman (ada di glibc, ABI sama)=%d | ada tapi ABI beda (perlu wrapper)=%d | perlu shim Darwin / tidak ada=%d\n", n_ok, n_risk, n_miss);
            qsort(l_risk, (size_t)n_risk, sizeof l_risk[0], cmp_sym);
            qsort(l_miss, (size_t)n_miss, sizeof l_miss[0], cmp_sym);
            P("\n-- ABI-RISK (%d)\n", n_risk);
            for (i = 0; i < n_risk; i++) P("  %-28s %s\n", l_risk[i], risk_for(l_risk[i]));
            P("\n-- PERLU SHIM / TIDAK ADA (%d, %d punya petunjuk)\n", n_miss, n_hint);
            for (i = 0; i < n_miss; i++) { const char *h = hint_for(l_miss[i]); P("  %-28s %s\n", l_miss[i], h ? h : "(tidak ada di glibc device)"); }
            qsort(l_ok, (size_t)n_ok, sizeof l_ok[0], cmp_sym);
            P("\n-- AMAN (%d)\n ", n_ok);
            for (i = 0; i < n_ok; i++) P(" %s", l_ok[i]);
            P("\n");

            P("\n=== runtime ObjC (%d fungsi/data) - butuh mini-runtime ===\n ", n_objc_rt);
            qsort(objc_rt, (size_t)n_objc_rt, sizeof objc_rt[0], cmp_sym);
            for (i = 0; i < n_objc_rt; i++) P(" %s", objc_rt[i]);
            P("\n");

            P("\n=== kelas Apple yang direferensikan (%d) - butuh handler objc_msgSend ===\n", n_objc_cls);
            {
              typedef struct { char key[160]; const char *nm; } KC;
              static KC kc[MAXSYM]; char last[64] = "";
              for (i = 0; i < n_objc_cls; i++) {
                const char *n = objc_cls[i], *c = strstr(n, "$_"); int k, ord = 0;
                for (k = 0; k < nusym; k++) if (!strcmp(usyms[k].name, n)) { ord = usyms[k].ord; break; }
                snprintf(kc[i].key, sizeof kc[i].key, "%s|%s", (ord >= 1 && ord <= ndyl) ? base_name(dylibs[ord - 1]) : "?", c ? c + 2 : n);
                kc[i].nm = c ? c + 2 : n;
              }
              qsort(kc, (size_t)n_objc_cls, sizeof kc[0], cmp_sym_kc);
              for (i = 0; i < n_objc_cls; i++) {
                char lb[64]; const char *bar = strchr(kc[i].key, '|');
                size_t ln = (size_t)(bar - kc[i].key); if (ln > 63) ln = 63;
                memcpy(lb, kc[i].key, ln); lb[ln] = 0;
                if (strcmp(last, lb)) { P("\n  [%s]", lb); strcpy(last, lb); }
                P(" %s", kc[i].nm);
              }
              P("\n");
            }

            P("\n=== framework lain yang dipakai (jumlah simbol per library) ===\n");
            for (i = 0; i < nfw; i++) P("  %-22s %d\n", fw[i].lib, fw[i].n);

            P("\n=== fungsi GL/EGL yang dipakai ===\n");
            P("  huruf: 1=libGLESv1_CM  2=libGLESv2  M=libmali  G=gl4es  (-=tidak ada)\n");
            for (i = 0; i < nusym; i++) {
              const char *n = usyms[i].name, *m = n + 1;
              int a, b, c, d;
              if (n[0] != '_' || (strncmp(m, "gl", 2) != 0 && strncmp(m, "egl", 3) != 0) || !(m[2] >= 'A' && m[2] <= 'Z') ) {
                if (!(strncmp(m, "egl", 3) == 0 && m[3] >= 'A' && m[3] <= 'Z')) continue;
              }
              a = h_gles1 && dlsym(h_gles1, m) != NULL; b = h_gles2 && dlsym(h_gles2, m) != NULL;
              c = h_mali && dlsym(h_mali, m) != NULL;   d = h_gl4es && dlsym(h_gl4es, m) != NULL;
              gl_total++; if (a || b || c || d) gl_any++; else gl_none++;
              P("  %c%c%c%c %s\n", a ? '1' : '-', b ? '2' : '-', c ? 'M' : '-', d ? 'G' : '-', m);
            }
            P("  ringkas: %d fungsi GL dipakai, %d ada di salah satu lib device, %d TIDAK ada\n", gl_total, gl_any, gl_none);
          }

          /* ---------------------------------------------------------------- metadata ObjC */
          static int vendor_class(const char *n) {
            static const char *pf[] = { "Flurry", "PH", "SBJson", "SDURL", "SDCached", "QueryComponents", "HardwareString", "OpenUDID", "__ARCLite", NULL };
            int i;
            for (i = 0; pf[i]; i++) if (!strncmp(n, pf[i], strlen(pf[i]))) return 1;
            return 0;
          }
          static int dump_methods(uint32_t ml, char tag, int show) {
            uint32_t entsize, count, i;
            if (!ml) return 0;
            entsize = R32(ml) & ~3u; count = R32(ml + 4);
            if (entsize < 12 || count > 4096) return 0;
            if (show) {
              for (i = 0; i < count && i < 200; i++) {
                uint32_t base = ml + 8 + i * entsize, imp = R32(base + 8);
                P("    %c %-46s imp=0x%08x%s\n", tag, vstr(R32(base)), imp & ~1u, (imp & 1) ? " (thumb)" : "");
              }
            }
            return (int)count;
          }
          static void dump_objc(int all) {
            const Sec *cl = find_sec("__objc_classlist"), *sr = find_sec("__objc_selrefs"), *mi = find_sec("__mod_init_func");
            uint32_t i, n, shown = 0, vend = 0;
            P("\n== ObjC + konstruktor ==\n");
            if (mi) {
              uint32_t k, cnt = mi->size / 4;
              P("  __mod_init_func: %u konstruktor statis (dijalankan loader sebelum masuk game)\n   ", cnt);
              for (k = 0; k < cnt && k < 8; k++) P(" 0x%08x", R32(mi->addr + 4 * k) & ~1u);
              P("%s\n", cnt > 8 ? " ..." : "");
            }
            if (sr) P("  selector refs: %u\n", sr->size / 4);
            if (!cl) { P("  tidak ada __objc_classlist\n"); return; }
            n = cl->size / 4;
            P("  kelas ObjC yang didefinisikan binary: %u (kelas vendor Flurry/PlayHaven/dll disembunyikan kecuali --all)\n", n);
            P("  catatan: IMP bit0=1 berarti Thumb. Nama method asli masih ada walau binary stripped -> titik masuk engine untuk Ghidra.\n");
            for (i = 0; i < n; i++) {
              uint32_t cva = R32(cl->addr + 4 * i), isa = R32(cva), sup = R32(cva + 4), ro = R32(cva + 16) & ~3u;
              uint32_t iro = R32(isa + 16) & ~3u;
              const char *name = vstr(R32(ro + 16)), *sname = "?";
              int ni, nc;
              if (vendor_class(name) && !all) { vend++; continue; }
              if (sup) { uint32_t k, m = cl->size / 4; for (k = 0; k < m; k++) { uint32_t o = R32(cl->addr + 4 * k); if (o == sup) { sname = vstr(R32(R32(o + 16) + 16)); break; } } }
              else { const char *b = bind_name_at(cva + 4); sname = b ? (strstr(b, "$_") ? strstr(b, "$_") + 2 : b) : "(root)"; }
              ni = dump_methods(R32(ro + 20), '-', 0); nc = dump_methods(R32(iro + 20), '+', 0);
              P("\n  @interface %s : %s   (instanceSize=%u, %d method instance, %d method kelas)\n", name, sname, R32(ro + 8), ni, nc);
              dump_methods(R32(iro + 20), '+', 1);
              dump_methods(R32(ro + 20), '-', 1);
              shown++;
            }
            P("\n  kelas ditampilkan=%u, kelas vendor disembunyikan=%u\n", shown, vend);
          }

          /* ---------------------------------------------------------------- .pvr */
          static void pvr_report(const char *path) {
            FILE *f = fopen(path, "rb"); uint8_t h[52]; uint32_t v[13]; const char *fmt = "?"; int pvrtc = 0;
            if (!f) { P("  %s: tidak bisa dibuka\n", path); return; }
            if (fread(h, 1, 52, f) != 52) { P("  %s: terlalu kecil\n", path); fclose(f); return; }
            fclose(f);
            memcpy(v, h, 52);
            if (memcmp(h + 44, "PVR!", 4) != 0) { P("  %s: bukan PVR v2 (magic tidak cocok)\n", path); return; }
            switch (v[4] & 0xff) {
            case 0x10: fmt = "RGBA4444"; break; case 0x11: fmt = "RGBA5551"; break; case 0x12: fmt = "RGBA8888"; break;
            case 0x13: fmt = "RGB565"; break; case 0x15: fmt = "RGB888"; break; case 0x18: fmt = "PVRTC 2bpp"; pvrtc = 1; break;
            case 0x19: fmt = "PVRTC 4bpp"; pvrtc = 1; break; case 0x1a: fmt = "BGRA8888"; break; default: break;
            }
            P("  %s: %ux%u mip=%u fmt=0x%02x (%s) bpp=%u data=%u B\n", path, v[2], v[1], v[3], v[4] & 0xff, fmt, v[6], v[5]);
            if (pvrtc) P("    -> PVRTC: Mali TIDAK mendukung GL_IMG_texture_compressed_pvrtc; decode ke RGBA8888 di shim glCompressedTexImage2D\n");
          }

          /* ---------------------------------------------------------------- main */
          int main(int argc, char **argv) {
            const char *bin = NULL, *repf = NULL, *pvr[16]; int npvr = 0, all = 0, i;
            struct utsname u; struct stat st; FILE *f;
            void *h_gles1, *h_gles2, *h_mali, *h_gl4es, *h_egl;

            for (i = 1; i < argc; i++) {
              if (!strcmp(argv[i], "--all")) all = 1;
              else if (!strcmp(argv[i], "--pvr") && i + 1 < argc && npvr < 16) pvr[npvr++] = argv[++i];
              else if (!bin) bin = argv[i];
              else if (!repf) repf = argv[i];
            }
            if (!bin) { fprintf(stderr, "pakai: %s <binary-mach-o> [report.txt] [--pvr file.pvr]... [--all]\n", argv[0]); return 2; }
            if (repf) rep = fopen(repf, "w");

            P("== machoprobe (Luxor 2 HD iOS, Milestone 1) ==\n");
            if (uname(&u) == 0) P("device: %s %s %s\n", u.sysname, u.release, u.machine);
            P("glibc: %s  sizeof(void*)=%u\n", gnu_get_libc_version(), (unsigned)sizeof(void *));

            dlopen("libm.so.6", RTLD_NOW | RTLD_GLOBAL);
            dlopen("libgcc_s.so.1", RTLD_NOW | RTLD_GLOBAL);
            dlopen("libstdc++.so.6", RTLD_NOW | RTLD_GLOBAL);
            dlopen("libBlocksRuntime.so.0", RTLD_NOW | RTLD_GLOBAL);

            P("\n== library grafik 32-bit di device ==\n");
            h_gles1 = try_open("/usr/lib32/libGLESv1_CM.so.1");
            h_gles2 = try_open("/usr/lib32/libGLESv2.so.2");
            h_mali  = try_open("/usr/lib32/libmali.so");
            h_egl   = try_open("/usr/lib32/libEGL.so.1");
            h_gl4es = try_open("/usr/lib32/gl4es/libGL.so.1");
            if (h_egl) P("  eglGetProcAddress: %s | eglGetDisplay: %s\n", dlsym(h_egl, "eglGetProcAddress") ? "ada" : "TIDAK", dlsym(h_egl, "eglGetDisplay") ? "ada" : "TIDAK");

            f = fopen(bin, "rb");
            if (!f || fstat(fileno(f), &st) != 0) { P("GAGAL membuka %s\n", bin); return 1; }
            DS = (size_t)st.st_size; D = malloc(DS);
            if (!D || fread(D, 1, DS, f) != DS) { P("GAGAL membaca %s\n", bin); return 1; }
            fclose(f);
            P("\nberkas: %s (%zu byte)\n", bin, DS);

            if (parse_macho() != 0) return 1;
            report_layout();
            report_env();
            classify(h_gles1, h_gles2, h_mali, h_gl4es);
            dump_objc(all);
            if (npvr) { P("\n== tekstur .pvr ==\n"); for (i = 0; i < npvr; i++) pvr_report(pvr[i]); }
            P("\n== machoprobe selesai ==\n");
            if (rep) fclose(rep);
            return 0;
          }
          EOF_C1
          cat > src/machoload.c <<'EOF_C2'
          /* machoload - Milestone 2 port Luxor 2 HD iOS (Mach-O armv7 -> muOS armhf).
           * Langkah:  1) map __TEXT/__DATA di alamat asli (MAP_FIXED)   2) bind semua impor ke shim/stub
           *           3) (opsional --ctors) jalankan konstruktor statis __mod_init_func, lalu berhenti.
           * Belum menjalankan game. Simbol yang belum punya shim diarahkan ke stub yang mencatat namanya saat dipanggil.
           * Build armhf: gcc -marm -pie -fPIE ... -ldl -lpthread -lm   (-marm WAJIB: thunk + setjmp ditulis ARM-mode) */
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdarg.h>
          #include <errno.h>
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <signal.h>
          #include <ucontext.h>
          #include <time.h>
          #include <math.h>
          #include <pthread.h>
          #include <semaphore.h>
          #include <sys/mman.h>
          #include <sys/stat.h>

          #ifdef __arm__
          #define SOFTFP __attribute__((pcs("aapcs")))
          #else
          #define SOFTFP
          #endif
          #ifndef MAP_32BIT
          #define MAP_32BIT 0
          #endif

          #define MH_MAGIC 0xfeedfaceu
          #define MAXSEG 16
          #define MAXSEC 64
          #define MAXDYL 32
          #define MAXSYM 1024
          #define MAXBND 8192
          #define THUNK_SZ 64

