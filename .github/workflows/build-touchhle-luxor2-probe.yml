name: build-touchhle-luxor2-probe

# Probe: build touchHLE (emulator iPhone OS) untuk Linux aarch64 (Anbernic/muOS),
# lalu coba jalankan Luxor_2_HD.ipa di device. BELUM TERVERIFIKASI, kemungkinan
# besar perlu iterasi (dependency / glibc / dukungan iPad 3.2 di touchHLE).

on:
  workflow_dispatch:

jobs:
  build:
    # 22.04 biar glibc lebih rendah (2.35) -> lebih besar peluang jalan di firmware handheld
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout touchHLE (+ submodule)
        uses: actions/checkout@v4
        with:
          repository: touchHLE/touchHLE
          submodules: recursive

      - name: Install dependency build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config git \
            libboost-dev libasound2-dev libpulse-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgles2-mesa-dev libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release 2>&1 | tee build_log.txt

      - name: Package
        run: |
          set -x
          mkdir -p out/touchHLE/touchHLE_apps
          cp target/release/touchHLE out/touchHLE/
          cp -r touchHLE_dylibs out/touchHLE/
          cp -r touchHLE_fonts out/touchHLE/
          cp touchHLE_default_options.txt out/touchHLE/
          cp touchHLE_options.txt out/touchHLE/ 2>/dev/null || true
          cp OPTIONS_HELP.txt out/touchHLE/ 2>/dev/null || true
          cp build_log.txt out/
          file out/touchHLE/touchHLE
          ldd out/touchHLE/touchHLE || true
          ldd --version | head -1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: touchhle-aarch64-linux
          path: out/
