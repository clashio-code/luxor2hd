          static void *gl_sym(const char *n) {
            void *p = NULL;
            if (!g_gl_tried) {
              g_gl_tried = 1;
              g_gl1 = dlopen("/usr/lib32/libGLESv1_CM.so.1", RTLD_NOW | RTLD_LOCAL);
              g_gl2 = dlopen("/usr/lib32/libGLESv2.so.2", RTLD_NOW | RTLD_LOCAL);
