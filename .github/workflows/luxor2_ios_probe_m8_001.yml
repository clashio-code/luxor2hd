          /* fungsi libc yang ABI-nya sama -> langsung ke glibc lewat dlsym (tanpa link-time versi, aman dari __isoc23_*) */
          static const char *const pass_tab[] = {
            "_abort", "_atoi", "_bsearch", "_calloc", "_close", "_exit", "_fclose", "_feof", "_ferror", "_fflush", "_fopen", "_fprintf",
            "_fputc", "_fputs", "_fread", "_free", "_freeifaddrs", "_fseek", "_ftell", "_fwrite", "_getcwd", "_getenv", "_gethostbyname",
            "_gettimeofday", "_if_nametoindex", "_inet_addr", "_inet_ntoa", "_listen", "_malloc", "_memchr", "_memcmp", "_memcpy", "_memmove",
            "_memset", "_mkdir", "_nanosleep", "_puts", "_qsort", "_realloc", "_recv", "_remove", "_rmdir", "_select", "_send", "_snprintf",
            "_sprintf", "_sscanf", "_strcasecmp", "_strchr", "_strcmp", "_strcpy", "_strcspn", "_strerror", "_strlen", "_strncasecmp", "_strncat",
            "_strncmp", "_strncpy", "_strrchr", "_strsignal", "_strstr", "_strtok", "_usleep", "_vsnprintf", "_arc4random",
            "___memcpy_chk", "___sprintf_chk", "___strcat_chk", "___strcpy_chk", "___cxa_atexit",
            "_pthread_attr_destroy", "_pthread_attr_init", "_pthread_attr_setstacksize", "_pthread_create", "_pthread_getspecific",
            "_pthread_join", "_pthread_key_create", "_pthread_key_delete", "_pthread_mutex_init", "_pthread_mutexattr_destroy",
            "_pthread_mutexattr_init", "_pthread_self", "_pthread_setspecific",
            NULL
          };

          static void *resolve(const char *name, int *how) {
            int i;
            for (i = 0; shim_tab[i].name; i++)
              if (!strcmp(shim_tab[i].name, name)) {
              *how = shim_tab[i].kind;
              /* M6f: shim GL (C kita) bisa tail-call langsung ke libmali -> wajib masuk dengan sp 8-aligned */
              if (shim_tab[i].kind == H_WRAP && !strncmp(name, "_gl", 3)) return align_wrap(shim_tab[i].addr);
              return shim_tab[i].addr;
            }
            for (i = 0; pass_tab[i]; i++)
              if (!strcmp(pass_tab[i], name)) {
                void *p = dlsym(RTLD_DEFAULT, name + 1);
                if (p) { *how = H_PASS; return align_wrap(p); }
                L("PERINGATAN: %s ada di daftar PASS tapi dlsym gagal -> stub\n", name);
                break;
              }
            { int hw = 0; void *q = resolve_objc(name, &hw); if (q) { *how = hw; return q; } }
            if (!strncmp(name, "_gl", 3) && name[3] >= 'A' && name[3] <= 'Z') {
              void *p = gl_sym(name + 1);
              if (p) { *how = H_PASS; return align_wrap(p); }
            }
            *how = H_STUB;
            return stub_for(name);
          }

          /* ============================================================ Mach-O */
          static uint32_t rd32(size_t off) { uint32_t v = 0; if (off + 4 <= DS) memcpy(&v, D + off, 4); return v; }
          static const char *base_name(const char *p) { const char *s = strrchr(p, '/'); return s ? s + 1 : p; }

          static int parse_macho(void) {
            uint32_t ncmds, off, i, j;
            if (DS < 28 || rd32(0) != MH_MAGIC || rd32(4) != 12) { L("bukan Mach-O armv7 32-bit\n"); return -1; }
            ncmds = rd32(16); off = 28;
            for (i = 0; i < ncmds && off + 8 <= DS; i++) {
              uint32_t cmd = rd32(off), cs = rd32(off + 4);
              if (cs < 8 || off + cs > DS) return -1;
              if (cmd == 0x1) {
                Seg *s; uint32_t nsc;
                if (nseg >= MAXSEG) { off += cs; continue; }
                s = &segs[nseg]; memcpy(s->name, D + off + 8, 16); s->name[16] = 0;
                s->vmaddr = rd32(off + 24); s->vmsize = rd32(off + 28); s->fileoff = rd32(off + 32); s->filesize = rd32(off + 36);
                nsc = rd32(off + 48);
                for (j = 0; j < nsc && nsec < MAXSEC; j++) {
                  size_t so = off + 56 + (size_t)j * 68; Sec *c = &secs[nsec++];
                  if (so + 68 > DS) break;
                  memcpy(c->name, D + so, 16); c->name[16] = 0; c->addr = rd32(so + 32); c->size = rd32(so + 36);
                }
                if (strcmp(s->name, "__PAGEZERO") && strcmp(s->name, "__LINKEDIT")) {
                  if (s->vmaddr < img_lo) img_lo = s->vmaddr;
                  if (s->vmaddr + s->vmsize > img_hi) img_hi = s->vmaddr + s->vmsize;
                }
                nseg++;
              } else if (cmd == 0xc || cmd == 0x80000018u || cmd == 0x8000001fu) {
                if (ndyl < MAXDYL) { strncpy(dylibs[ndyl], (const char *)D + off + rd32(off + 8), sizeof dylibs[0] - 1); ndyl++; }
              } else if (cmd == 0x22 || cmd == 0x80000022u) {
                for (j = 0; j < 10; j++) dyld_info[j] = rd32(off + 8 + j * 4);
                have_dyld = 1;
              } else if (cmd == 0x5) {
                          entry_pc = rd32(off + 76); entry_cpsr = rd32(off + 80); have_entry = 1;
                        } else if (cmd == 0x21) {
                if (rd32(off + 16)) { L("binary TERENKRIPSI (cryptid=1): pakai IPA yang sudah di-decrypt\n"); return -1; }
              }
              off += cs;
            }
            return 0;
          }
          static Sec *find_sec(const char *n) { int i; for (i = 0; i < nsec; i++) if (!strcmp(secs[i].name, n)) return &secs[i]; return NULL; }

          static uint64_t uleb(const uint8_t **p, const uint8_t *e) {
            uint64_t r = 0; int sh = 0;
            while (*p < e) { uint8_t b = *(*p)++; if (sh < 64) r |= (uint64_t)(b & 0x7f) << sh; sh += 7; if (!(b & 0x80)) break; }
            return r;
          }
          static int64_t sleb(const uint8_t **p, const uint8_t *e) {
            int64_t r = 0; int sh = 0; uint8_t b = 0;
            while (*p < e) { b = *(*p)++; if (sh < 64) r |= (int64_t)(b & 0x7f) << sh; sh += 7; if (!(b & 0x80)) break; }
            if (sh < 64 && (b & 0x40)) r |= -((int64_t)1 << sh);
            return r;
          }
          static int usym_get(const char *name, int ord) {
            int i;
            for (i = 0; i < nusym; i++) if (!strcmp(usyms[i].name, name)) return i;
            if (nusym >= MAXSYM) return -1;
            memset(&usyms[nusym], 0, sizeof usyms[0]);
            strncpy(usyms[nusym].name, name, sizeof usyms[0].name - 1);
            usyms[nusym].ord = ord;
            return nusym++;
          }
          static void add_bind(const char *sym, int ord, int seg, uint64_t so, int kind, int64_t addend) {
            int u;
            if (seg < 0 || seg >= nseg || nbinds >= MAXBND) return;
            u = usym_get(sym, ord);
            if (u < 0) return;
            usyms[u].nbind++;
            if (kind != 2 && usyms[u].ord == 0) usyms[u].ord = ord;
            binds[nbinds].va = segs[seg].vmaddr + (uint32_t)so; binds[nbinds].usym = u; binds[nbinds].kind = kind; binds[nbinds].addend = (int32_t)addend; nbinds++;
          }
          static void parse_binds(uint32_t off, uint32_t size, int kind) {
            const uint8_t *p, *e; char sym[96] = ""; int ord = 0, seg = 0; uint64_t so = 0; int64_t addend = 0;
            if (!size || (size_t)off + size > DS) return;
            p = D + off; e = p + size;
            while (p < e) {
              uint8_t b = *p++; int op = b & 0xF0, imm = b & 0x0F;
              switch (op) {
              case 0x00: if (kind == 1) break; return;
              case 0x10: ord = imm; break;
              case 0x20: ord = (int)uleb(&p, e); break;
              case 0x30: ord = imm ? (int)(int8_t)(0xF0 | imm) : 0; break;
              case 0x40: { size_t n = strnlen((const char *)p, (size_t)(e - p)); size_t c = n < sizeof sym - 1 ? n : sizeof sym - 1; memcpy(sym, p, c); sym[c] = 0; p += n + 1; break; }
              case 0x50: break;
              case 0x60: addend = sleb(&p, e); break;
              case 0x70: seg = imm; so = uleb(&p, e); break;
              case 0x80: so += uleb(&p, e); break;
              case 0x90: add_bind(sym, ord, seg, so, kind, addend); so += 4; break;
              case 0xA0: add_bind(sym, ord, seg, so, kind, addend); so += 4 + uleb(&p, e); break;
              case 0xB0: add_bind(sym, ord, seg, so, kind, addend); so += 4 + (uint64_t)imm * 4; break;
              case 0xC0: { uint64_t cnt = uleb(&p, e), skip = uleb(&p, e), i; for (i = 0; i < cnt && i < 100000; i++) { add_bind(sym, ord, seg, so, kind, addend); so += 4 + skip; } break; }
              default: L("opcode bind tak dikenal 0x%02x\n", b); return;
              }
            }
          }

          /* ============================================================ registrasi kelas ObjC milik binary + +load */
          static uint8_t g_loaded[MAXCI];
          static void call_load(ClsInfo *ci) {
            ClsInfo *sci, *cm; U imp; int idx = (int)(ci - g_ci);
            if (g_loaded[idx]) return;
            g_loaded[idx] = 1;
            sci = ci_of(M32(ci->cls + 4));
            if (sci && !sci->fake && !sci->is_meta) call_load(sci);
            cm = ci_of(M32(ci->cls));
            imp = cm ? list_find(cm->base, "load") : 0;
            if (imp) { L("  +load %s (imp=0x%08x)\n", ci->name, imp & ~1u); call_game4((uintptr_t)imp, (uintptr_t)ci->cls, (uintptr_t)"load", 0, 0); }
          }
          static void objc_setup(int do_load) {
            const Sec *cl = find_sec("__objc_classlist"), *ct = find_sec("__objc_catlist");
            U i, n, ncat = 0, nloaded = 0; int nfake = 0, k;
            if (!cl) { L("  tidak ada __objc_classlist\n"); return; }
            n = cl->size / 4;
            for (i = 0; i < n; i++) {
              U cls = M32(cl->addr + 4 * i), meta = M32(cls), ro = M32(cls + 16) & ~3u, mro = M32(meta + 16) & ~3u;
              const char *name = (const char *)A2P(M32(ro + 16));
              ClsInfo *ci = ci_new(cls, name, 0, 0), *cm = ci_new(meta, name, 1, 0);
              ci->ro = ro; cm->ro = mro; ci->instsize = M32(ro + 8); cm->instsize = M32(mro + 8);
              ci->base = M32(ro + 20); cm->base = M32(mro + 20);
              if (ci->base) ci->lists[ci->nlists++] = ci->base;
              if (cm->base) cm->lists[cm->nlists++] = cm->base;
            }
            if (ct) {
              for (i = 0; i < ct->size / 4; i++) {
                U cat = M32(ct->addr + 4 * i), cls = M32(cat + 4), im = M32(cat + 8), cmth = M32(cat + 12);
                ClsInfo *ci = ci_of(cls), *cm = cls ? ci_of(M32(cls)) : NULL;
                if (!ci || !cm) { L("  kategori %s: kelas target tidak dikenal (0x%08x)\n", (const char *)A2P(M32(cat)), cls); continue; }
                if (im && ci->nlists < MAXLISTS) ci->lists[ci->nlists++] = im;
                if (cmth && cm->nlists < MAXLISTS) cm->lists[cm->nlists++] = cmth;
                ncat++;
              }
            }
            for (k = 0; k < nci; k++) if (g_ci[k].fake && !g_ci[k].is_meta) nfake++;
            L("  kelas biner=%u  kategori=%u  kelas palsu (Apple)=%d  total ClsInfo=%d\n", n, ncat, nfake, nci);
            if (!do_load) { L("  +load dilewati\n"); return; }
            g_phase = "+load";
            for (i = 0; i < n; i++) { ClsInfo *ci = ci_of(M32(cl->addr + 4 * i)); if (ci) { call_load(ci); nloaded++; } }
            if (ct) for (i = 0; i < ct->size / 4; i++) {
              U cat = M32(ct->addr + 4 * i), cls = M32(cat + 4), cmth = M32(cat + 12), imp = list_find(cmth, "load");
              if (imp) { L("  +load kategori %s (imp=0x%08x)\n", (const char *)A2P(M32(cat)), imp & ~1u); call_game4((uintptr_t)imp, (uintptr_t)cls, (uintptr_t)"load", 0, 0); }
            }
            L("  +load selesai\n");
          }

          /* ============================================================ map */
          static int range_clash(void) {
            FILE *f = fopen("/proc/self/maps", "r"); char line[512]; int clash = 0;
            if (!f) return 0;
            while (fgets(line, sizeof line, f)) {
              unsigned long long a, b; const char *q = p_hex(line, &a);
              if (q && *q == '-' && p_hex(q + 1, &b) && a < img_hi && b > img_lo) { L("BENTROK: %s", line); clash = 1; }
            }
            fclose(f);
            return clash;
          }
          static int map_image(void) {
            int i; void *p;
            if (range_clash()) { L("rentang 0x%08x..0x%08x sudah dipakai proses ini\n", img_lo, img_hi); return -1; }
            p = mmap((void *)(uintptr_t)img_lo, img_hi - img_lo, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANONYMOUS | MAP_FIXED, -1, 0);
            if (p == MAP_FAILED || (uintptr_t)p != img_lo) { L("GAGAL map 0x%08x..0x%08x: %s\n", img_lo, img_hi, strerror(errno)); return -1; }
            for (i = 0; i < nseg; i++) {
              const Seg *s = &segs[i];
              if (!strcmp(s->name, "__PAGEZERO") || !strcmp(s->name, "__LINKEDIT") || !s->filesize) continue;
              if ((size_t)s->fileoff + s->filesize > DS) { L("segmen %s melewati akhir file\n", s->name); return -1; }
              memcpy((void *)(uintptr_t)s->vmaddr, D + s->fileoff, s->filesize);
              L("  map %-8s 0x%08x..0x%08x  (%u B dari file, %u B zero-fill)\n", s->name, s->vmaddr, s->vmaddr + s->vmsize, s->filesize,
                s->vmsize > s->filesize ? s->vmsize - s->filesize : 0);
            }
            return 0;
          }
          static void protect_image(void) {
            int i;
            for (i = 0; i < nseg; i++) {
              const Seg *s = &segs[i];
              if (!strcmp(s->name, "__TEXT")) {
          #ifdef __arm__
                __builtin___clear_cache((char *)(uintptr_t)s->vmaddr, (char *)(uintptr_t)(s->vmaddr + s->vmsize));
          #endif
                if (mprotect((void *)(uintptr_t)s->vmaddr, s->vmsize, PROT_READ | PROT_EXEC) != 0) L("PERINGATAN: mprotect __TEXT RX gagal: %s\n", strerror(errno));
                else L("  __TEXT -> r-x\n");
              }
            }
          }

          /* ============================================================ crash handler */
          static volatile int g_cur_ctor = -1;
          static void crash(int sig, siginfo_t *si, void *ctx) {
            L("\n*** %s (sinyal %d) fault_addr=%p  fase=%s ctor=%d  stub_terakhir=%s\n", sig == SIGALRM ? "TIMEOUT/hang" : "CRASH", sig, si ? si->si_addr : NULL, g_phase, g_cur_ctor, g_last_stub);
            if (g_msg_self) L("  pesan ObjC terakhir: self=0x%08x sel=%s lr=0x%08x\n", g_msg_self, ((uintptr_t)g_msg_sel >= img_lo && (uintptr_t)g_msg_sel < img_hi) ? g_msg_sel : "(?)", g_msg_lr);
          #ifdef __arm__
            {
              ucontext_t *uc = (ucontext_t *)ctx; const mcontext_t *m = &uc->uc_mcontext;
              L("  pc=0x%08lx lr=0x%08lx sp=0x%08lx cpsr=0x%08lx (%s)\n", m->arm_pc, m->arm_lr, m->arm_sp, m->arm_cpsr, (m->arm_cpsr & 0x20) ? "Thumb" : "ARM");
              L("  r0=%08lx r1=%08lx r2=%08lx r3=%08lx r4=%08lx r5=%08lx r6=%08lx r7=%08lx\n", m->arm_r0, m->arm_r1, m->arm_r2, m->arm_r3, m->arm_r4, m->arm_r5, m->arm_r6, m->arm_r7);
              L("  r8=%08lx r9=%08lx r10=%08lx fp=%08lx ip=%08lx\n", m->arm_r8, m->arm_r9, m->arm_r10, m->arm_fp, m->arm_ip);
              {
                Dl_info di; unsigned long av[2]; int k;
                av[0] = m->arm_pc; av[1] = m->arm_lr;
                for (k = 0; k < 2; k++) {
                  memset(&di, 0, sizeof di);
                  if (dladdr((void *)av[k], &di) && di.dli_fname) {
                    if (di.dli_sname) L("  %s = %s+0x%lx  [%s]\n", k ? "lr" : "pc", di.dli_sname, av[k] - (unsigned long)di.dli_saddr, di.dli_fname);
                    else L("  %s di %s +0x%lx\n", k ? "lr" : "pc", di.dli_fname, av[k] - (unsigned long)di.dli_fbase);
                  }
                }
                L("  sp&7=%lu (%s)\n", m->arm_sp & 7, (m->arm_sp & 7) ? "sp TIDAK 8-aligned" : "sp 8-aligned");
                if (m->arm_cpsr & 0x20) L("  instruksi di pc (thumb): %04x %04x\n", ((unsigned short *)(m->arm_pc & ~1ul))[0], ((unsigned short *)(m->arm_pc & ~1ul))[1]);
                else L("  instruksi di pc (arm): %08x\n", *(unsigned *)m->arm_pc);
              }
              L("  si_code=%d%s\n", si ? si->si_code : 0, (si && si->si_code == SI_TKILL) ? "  (SI_TKILL: sinyal DIKIRIM ULANG lewat tgkill/raise - crash asli terjadi lebih dulu, kemungkinan handler lain menangkap duluan)" : "");
              {   /* M6c: backtrace kasar - cari alamat kembali di stack yang jatuh di __TEXT game */
                uint32_t *p = (uint32_t *)(m->arm_sp & ~3ul); int k, n = 0;
                L("  stack scan (kandidat alamat kembali di game, cek di Ghidra):\n");
                for (k = 0; k < 2048 && n < 24; k++) {
                  uint32_t v = p[k];
                  if (v >= img_lo && v < 0x001c0000u) { L("    sp+0x%03x: 0x%08x%s\n", k * 4, v, (v & 1) ? " (thumb)" : ""); n++; }
                }
              }
              if (m->arm_pc >= img_lo && m->arm_pc < img_hi) L("  pc DI DALAM image game (alamat sama dengan Ghidra/IDA): 0x%08lx\n", m->arm_pc);
              if (m->arm_lr >= img_lo && m->arm_lr < img_hi) L("  lr di dalam image game: 0x%08lx\n", m->arm_lr);
            }
          #else
            (void)ctx;
          #endif
            print_summary(); _exit(128 + sig);
          }
          static void install_crash(void) {
            struct sigaction sa; stack_t ss; int sigs[] = { SIGSEGV, SIGBUS, SIGILL, SIGFPE, SIGABRT, SIGALRM }; unsigned i;
            ss.ss_sp = malloc(65536); ss.ss_size = 65536; ss.ss_flags = 0; sigaltstack(&ss, NULL);
            memset(&sa, 0, sizeof sa); sa.sa_sigaction = crash; sa.sa_flags = SA_SIGINFO | SA_ONSTACK; sigemptyset(&sa.sa_mask);
            for (i = 0; i < sizeof sigs / sizeof sigs[0]; i++) sigaction(sigs[i], &sa, NULL);
          }

          /* ============================================================ main */
          int main(int argc, char **argv) {
            const char *bin = NULL, *logf = NULL; int ctors = 0, timeout = 30, skip[32], nskip = 0, i, j, do_run = 0, noload = 0; FILE *f; struct stat st;
            int cnt_how[5] = { 0, 0, 0, 0, 0 }, fit_fail = 0, written = 0, weak_skip = 0;
            static char *fake_argv[] = { (char *)"luxor2", NULL };
            static char *fake_apple[] = { (char *)"executable_path=luxor2", NULL };

            for (i = 1; i < argc; i++) {
              if (!strcmp(argv[i], "--log") && i + 1 < argc) logf = argv[++i];
              else if (!strcmp(argv[i], "--ctors") && i + 1 < argc) { i++; ctors = !strcmp(argv[i], "all") ? -1 : p_dec(argv[i]); }
              else if (!strcmp(argv[i], "--skip") && i + 1 < argc && nskip < 32) skip[nskip++] = p_dec(argv[++i]);
              else if (!strcmp(argv[i], "--timeout") && i + 1 < argc) timeout = p_dec(argv[++i]);
              else if (!strcmp(argv[i], "--run")) do_run = 1;
              else if (!strcmp(argv[i], "--noload")) noload = 1;
              else if (!strcmp(argv[i], "--trace") && i + 1 < argc) g_trace_left = p_dec(argv[++i]);
              else if (!bin) bin = argv[i];
            }
            if (!bin) { fprintf(stderr, "pakai: %s <binary> [--log f] [--ctors N|all] [--skip i]... [--timeout detik] [--run] [--noload] [--trace N]\n", argv[0]); return 2; }
            if (logf) g_logfd = open(logf, O_WRONLY | O_CREAT | O_TRUNC, 0644);

            L("== machoload (Luxor 2 HD iOS, Milestone 3, align-thunk) ==\n");
            L("sizeof(void*)=%u mode=%s\n", (unsigned)sizeof(void *), ctors ? "map+bind+ctors" : "map+bind (dry, tanpa menjalankan kode game)");
            f = fopen(bin, "rb");
            if (!f || fstat(fileno(f), &st) != 0) { L("GAGAL membuka %s\n", bin); return 1; }
            DS = (size_t)st.st_size; D = (uint8_t *)malloc(DS);
            if (!D || fread(D, 1, DS, f) != DS) { L("GAGAL membaca %s\n", bin); return 1; }
            fclose(f);
            if (parse_macho() != 0) return 1;

            {
              pthread_mutexattr_t a; pthread_mutexattr_init(&a); pthread_mutexattr_settype(&a, PTHREAD_MUTEX_RECURSIVE);
              pthread_mutex_init(&g_guard_mx, &a); pthread_mutex_init(&g_once_mx, &a);
            }
            g_stderrp = stderr; g_stdinp = stdin; g_stdoutp = stdout;
            init_rune(); init_math(); thunks_alloc();
            p_glClearColor = (void (*)(float, float, float, float))gl_sym("glClearColor");
            p_glTranslatef = (void (*)(float, float, float))gl_sym("glTranslatef");
            p_glUniform1f = (void (*)(int, float))gl_sym("glUniform1f");

            L("\n[1] map image 0x%08x..0x%08x\n", img_lo, img_hi);
            if (map_image() != 0) return 1;

            L("\n[2] bind\n");
            if (!have_dyld) { L("tidak ada LC_DYLD_INFO\n"); return 1; }
            parse_binds(dyld_info[2], dyld_info[3], 0);
            parse_binds(dyld_info[6], dyld_info[7], 1);
            parse_binds(dyld_info[4], dyld_info[5], 2);
            L("  titik bind=%d  simbol unik=%d\n", nbinds, nusym);
            for (i = 0; i < nusym; i++) { usyms[i].addr = resolve(usyms[i].name, &usyms[i].how); cnt_how[usyms[i].how]++; }
            L("  hasil resolusi: PASS(glibc langsung)=%d  WRAP(shim sendiri)=%d  DATA=%d  STUB(belum ada, dicatat saat dipanggil)=%d\n",
              cnt_how[H_PASS], cnt_how[H_WRAP], cnt_how[H_DATA], cnt_how[H_STUB]);
            L("  PASS dibungkus align-thunk (sp 8-byte): %d%s\n", g_nalign, getenv("LUXOR_NOALIGN") ? "  [DIMATIKAN via LUXOR_NOALIGN]" : "");
            for (i = 0; i < nbinds; i++) {
              const BindRec *b = &binds[i]; const USym *u = &usyms[b->usym]; uint64_t v;
              if (b->kind == 2) { weak_skip++; continue; }
              if (b->va < img_lo || b->va + 4 > img_hi) { L("  bind di luar image: 0x%08x %s\n", b->va, u->name); continue; }
              v = (uint64_t)(uintptr_t)u->addr + (uint64_t)(int64_t)b->addend;
              if (v > 0xffffffffull) { fit_fail++; continue; }
              *(uint32_t *)(uintptr_t)b->va = (uint32_t)v; written++;
            }
            L("  slot ditulis=%d  weak-bind dilewati=%d%s\n", written, weak_skip, fit_fail ? "  (alamat >32-bit: hanya terjadi di host 64-bit)" : "");
            L("\n  daftar simbol (jenis / nama / jumlah titik bind):\n");
            for (j = 1; j <= 4; j++) {
              int first = 1;
              for (i = 0; i < nusym; i++) if (usyms[i].how == j) {
                const USym *u = &usyms[i];
                if (first) { L("  --- %s ---\n", how_name[j]); first = 0; }
                L("    %-34s x%-3d %s\n", u->name, u->nbind, (u->ord >= 1 && u->ord <= ndyl) ? base_name(dylibs[u->ord - 1]) : "");
              }
            }
            thunks_seal();
            protect_image();

            if (do_run) ctors = -1;
            if (ctors) install_crash();
          #ifdef __arm__
            if (ctors) alarm((unsigned)timeout);
          #endif
            atexit(print_summary);
            init_paths();
            L("\n[2b] runtime ObjC\n");
          #ifdef __arm__
            g_phase = "objc_setup";
            objc_setup(ctors && !noload);
          #else
            (void)noload; L("  (host non-ARM: dilewati)\n");
          #endif
            g_phase = "ctor";
            L("\n[3] konstruktor statis\n");
            {
              const Sec *mi = find_sec("__mod_init_func");
              int n = mi ? (int)(mi->size / 4) : 0, run = ctors < 0 ? n : (ctors > n ? n : ctors);
              L("  __mod_init_func: %d konstruktor; dijalankan: %d\n", n, ctors ? run : 0);
              if (ctors && n) {
                extern char **environ;
                install_crash();
          #ifdef __arm__
                alarm((unsigned)timeout);
          #else
                (void)timeout; L("  (host non-ARM: konstruktor TIDAK dijalankan)\n"); run = 0;
          #endif
                for (i = 0; i < run; i++) {
                  uint32_t a = *(uint32_t *)(uintptr_t)(mi->addr + 4 * (uint32_t)i); int sk = 0;
                  for (j = 0; j < nskip; j++) if (skip[j] == i) sk = 1;
                  if (sk) { L("  ctor %3d/%d @0x%08x DILEWATI\n", i, n, a & ~1u); continue; }
                  g_cur_ctor = i;
                  L("  ctor %3d/%d @0x%08x%s ...\n", i, n, a & ~1u, (a & 1) ? " (thumb)" : "");
                  call_game4((uintptr_t)a, 1, (uintptr_t)fake_argv, (uintptr_t)environ, (uintptr_t)fake_apple);
                }
                g_cur_ctor = -1; if (!do_run) alarm(0);
                if (run) L("  semua %d konstruktor selesai tanpa crash\n", run);
              }
            }
            if (do_run) {
          #ifdef __arm__
              if (!have_entry) L("\n[4] tidak ada LC_UNIXTHREAD/entry point\n");
              else { L("\n[4] masuk ke entry point game\n"); g_phase = "entry"; run_entry(); }
          #else
              L("\n[4] (host non-ARM: --run dilewati)\n");
          #endif
            }
            print_summary();
            L("== machoload selesai ==\n");
            if (g_logfd >= 0) close(g_logfd);
            _exit(0);
          }
          EOF_C2
          cat > out/LuxorIpaProbe.sh <<'EOF_SH1'
          #!/bin/bash
          # Probe Luxor 2 HD iOS (Milestone 1). Hanya membaca.
          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}

          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
            controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi

          source $controlfolder/control.txt
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"

          GAMEDIR="/$directory/ports/luxor2_ios"
          [ -d "$GAMEDIR" ] || GAMEDIR="$(cd "$(dirname "$0")" && pwd)/luxor2_ios"

          cd "$GAMEDIR" || {
            echo "folder luxor2_ios tidak ketemu. Dicari di: /$directory/ports/luxor2_ios dan di sebelah script ini." > "$(dirname "$0")/probe_error.txt"
            exit 1
          }

          export LD_LIBRARY_PATH="/usr/lib32:/lib32:${LD_LIBRARY_PATH}"
          chmod +x ./machoprobe ./machoload 2>/dev/null

          if [ ! -f bin/luxor2 ]; then
            echo "bin/luxor2 belum ada di $GAMEDIR/bin (lihat TARUH-BINARY-DI-SINI.txt)" > probe_report.txt
            sleep 3
            exit 1
          fi

          echo "GAMEDIR=$GAMEDIR" > probe_stdout.txt
          PVRARGS=""
          for f in bin/*.pvr; do [ -f "$f" ] && PVRARGS="$PVRARGS --pvr $f"; done
          ./machoprobe bin/luxor2 probe_report.txt $PVRARGS >> probe_stdout.txt 2>&1

          echo "exit code: $?" >> probe_stdout.txt
          sleep 2
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF_SH1
          cat > out/LuxorIpaLoad_dry.sh <<'EOF_SH2'
