name: build-armhf-luxor2-ios-diagnostic-m8
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pasang toolchain ARM 32-bit
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Tulis sumber
        run: |
          mkdir -p src out/luxor2_ios/bin
          cat > src/machoprobe.c <<'EOF_C1'
          /* machoprobe - Milestone 1 port Luxor 2 HD iOS (Mach-O armv7 -> muOS armhf).
           * HANYA MEMBACA: mem-parse binary Mach-O 32-bit ARM lalu melaporkan:
           *   - layout segmen + cek apakah alamat tetap (0x1000...) bisa di-map di device
           *   - impor (bind / lazy-bind / weak-bind) dan klasifikasinya terhadap glibc + GL device
           *   - metadata ObjC (kelas + method + alamat IMP) untuk mencari titik masuk engine
           *   - (opsional) header file .pvr
           * Tidak menjalankan kode game. */
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdarg.h>
          #include <errno.h>
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <sys/utsname.h>
          #include <gnu/libc-version.h>

          #ifndef MAP_FIXED_NOREPLACE
          #define MAP_FIXED_NOREPLACE 0x100000
          #endif

          #define MH_MAGIC          0xfeedfaceu
          #define CPU_TYPE_ARM      12
          #define MH_PIE            0x200000u
          #define LC_SEGMENT_       0x1u
          #define LC_SYMTAB_        0x2u
          #define LC_UNIXTHREAD_    0x5u
          #define LC_DYSYMTAB_      0xbu
          #define LC_LOAD_DYLIB_    0xcu
          #define LC_UUID_          0x1bu
          #define LC_CODE_SIG_      0x1du
          #define LC_DYLD_INFO_     0x22u
          #define LC_ENCRYPT_       0x21u
          #define LC_VER_IPHONEOS_  0x25u
          #define LC_FUNC_STARTS_   0x26u
          #define LC_REQ_DYLD       0x80000000u
          #define LC_LOAD_WEAK_     (0x18u | LC_REQ_DYLD)
          #define LC_REEXPORT_      (0x1fu | LC_REQ_DYLD)
          #define LC_DYLD_INFO_ONLY (0x22u | LC_REQ_DYLD)
          #define LC_MAIN_          (0x28u | LC_REQ_DYLD)

          #define MAXSEG 16
          #define MAXSEC 64
          #define MAXDYL 32
          #define MAXSYM 1024
          #define MAXBND 8192

          typedef struct { char name[17]; uint32_t vmaddr, vmsize, fileoff, filesize; int prot, maxprot; } Seg;
          typedef struct { char name[17], seg[17]; uint32_t addr, size, offset, flags; int segidx; } Sec;
          typedef struct { char name[96]; int ord; int nlazy, nbind, nweak; } USym;
          typedef struct { uint32_t va; int usym; int kind; } BindRec;

          static FILE *rep;
          static uint8_t *D; static size_t DS;
          static Seg segs[MAXSEG]; static int nseg;
          static Sec secs[MAXSEC]; static int nsec;
          static char dylibs[MAXDYL][200]; static int dylweak[MAXDYL]; static int ndyl;
          static USym usyms[MAXSYM]; static int nusym;
          static BindRec binds[MAXBND]; static int nbinds;
          static int secbinds[MAXSEC];
          static uint32_t dyld_info[10]; static int have_dyld;
          static uint32_t symtab[4]; static uint32_t dysym[18]; static int have_symtab, have_dysym;
          static uint32_t entry_pc; static int have_entry;
          static uint32_t img_lo = 0xffffffffu, img_hi;
          static int g_clash;   /* ada mapping proses yang menabrak rentang game */

          static void P(const char *fmt, ...) {
            va_list ap;
            va_start(ap, fmt); vprintf(fmt, ap); va_end(ap);
            if (rep) { va_start(ap, fmt); vfprintf(rep, fmt, ap); va_end(ap); }
          }

          /* parser angka sendiri: scanf/strto* di header glibc >=2.38 jadi __isoc23_* (butuh GLIBC_2.38, device cuma 2.37) */
          static const char *p_hex(const char *s, unsigned long long *out) {
            unsigned long long v = 0; int n = 0;
            while (*s == ' ' || *s == '\t') s++;
            for (;; s++, n++) {
              int c = (unsigned char)*s, d;
              if (c >= '0' && c <= '9') d = c - '0'; else if (c >= 'a' && c <= 'f') d = c - 'a' + 10;
              else if (c >= 'A' && c <= 'F') d = c - 'A' + 10; else break;
              v = v * 16 + (unsigned)d;
            }
            if (!n) return NULL;
            *out = v; return s;
          }
          static const char *p_dec(const char *s, unsigned long long *out) {
            unsigned long long v = 0; int n = 0;
            while (*s == ' ' || *s == '\t') s++;
            for (; *s >= '0' && *s <= '9'; s++, n++) v = v * 10 + (unsigned)(*s - '0');
            if (!n) return NULL;
            *out = v; return s;
          }

          static uint32_t rd32(size_t off) {
            uint32_t v = 0;
            if (off + 4 <= DS) memcpy(&v, D + off, 4);
            return v;
          }

          /* alamat virtual game -> pointer di dalam file (hanya bagian yang file-backed) */
          static const uint8_t *va2p(uint32_t va) {
            int i;
            for (i = 0; i < nseg; i++) {
              const Seg *s = &segs[i];
              if (s->filesize && va >= s->vmaddr && va < s->vmaddr + s->filesize) {
                size_t off = (size_t)s->fileoff + (va - s->vmaddr);
                return off < DS ? D + off : NULL;
              }
            }
            return NULL;
          }
          static uint32_t R32(uint32_t va) {
            const uint8_t *p = va2p(va); uint32_t v = 0;
            if (p && (size_t)(p - D) + 4 <= DS) memcpy(&v, p, 4);
            return v;
          }
          static const char *vstr(uint32_t va) {
            const uint8_t *p = va2p(va);
            return p ? (const char *)p : "?";
          }
          static Sec *find_sec(const char *name) {
            int i;
            for (i = 0; i < nsec; i++) if (strcmp(secs[i].name, name) == 0) return &secs[i];
            return NULL;
          }
          static int sec_of_va(uint32_t va) {
            int i;
            for (i = 0; i < nsec; i++) if (va >= secs[i].addr && va < secs[i].addr + secs[i].size) return i;
            return -1;
          }
          static const char *base_name(const char *p) { const char *s = strrchr(p, '/'); return s ? s + 1 : p; }

          /* ---------------------------------------------------------------- header + load commands */
          static int parse_macho(void) {
            uint32_t magic, cpu, sub, ft, ncmds, sizeofcmds, flags, off, i, j;
            if (DS < 28) { P("file terlalu kecil\n"); return -1; }
            magic = rd32(0); cpu = rd32(4); sub = rd32(8); ft = rd32(12); ncmds = rd32(16); sizeofcmds = rd32(20); flags = rd32(24);
            if (magic != MH_MAGIC) {
              if (magic == 0xbebafecau || magic == 0xcafebabeu) P("file ini FAT/universal binary: ekstrak slice armv7 dulu (lipo -thin armv7)\n");
              else P("bukan Mach-O 32-bit little-endian (magic=0x%08x)\n", magic);
              return -1;
            }
            if ((int)cpu != CPU_TYPE_ARM) { P("bukan ARM (cputype=%u)\n", cpu); return -1; }
            P("== header ==\n");
            P("  cputype=ARM subtype=%u (%s) filetype=%u (%s) ncmds=%u sizeofcmds=%u\n", sub,
              sub == 9 ? "armv7" : sub == 11 ? "armv7s" : sub == 6 ? "armv6" : "?", ft,
              ft == 2 ? "EXECUTE" : ft == 6 ? "DYLIB" : "?", ncmds, sizeofcmds);
            P("  flags=0x%08x  %s\n", flags, (flags & MH_PIE) ? "PIE (bisa direlokasi)" : "NON-PIE: harus di-map di alamat asli");
            off = 28;
            for (i = 0; i < ncmds && off + 8 <= DS; i++) {
              uint32_t cmd = rd32(off), cs = rd32(off + 4);
              if (cs < 8 || off + cs > DS) { P("load command rusak (idx %u)\n", i); return -1; }
              switch (cmd) {
              case LC_SEGMENT_: {
                Seg *s; uint32_t nsc;
                if (nseg >= MAXSEG) break;
                s = &segs[nseg];
                memcpy(s->name, D + off + 8, 16); s->name[16] = 0;
                s->vmaddr = rd32(off + 24); s->vmsize = rd32(off + 28); s->fileoff = rd32(off + 32); s->filesize = rd32(off + 36);
                s->maxprot = (int)rd32(off + 40); s->prot = (int)rd32(off + 44);
                nsc = rd32(off + 48);
                for (j = 0; j < nsc && nsec < MAXSEC; j++) {
                  size_t so = off + 56 + (size_t)j * 68;
                  Sec *c = &secs[nsec++];
                  if (so + 68 > DS) break;
                  memcpy(c->name, D + so, 16); c->name[16] = 0;
                  memcpy(c->seg, D + so + 16, 16); c->seg[16] = 0;
                  c->addr = rd32(so + 32); c->size = rd32(so + 36); c->offset = rd32(so + 40); c->flags = rd32(so + 56);
                  c->segidx = nseg;
                }
                if (strcmp(s->name, "__PAGEZERO") != 0 && strcmp(s->name, "__LINKEDIT") != 0) {
                  if (s->vmaddr < img_lo) img_lo = s->vmaddr;
                  if (s->vmaddr + s->vmsize > img_hi) img_hi = s->vmaddr + s->vmsize;
                }
                nseg++;
                break; }
              case LC_LOAD_DYLIB_: case LC_LOAD_WEAK_: case LC_REEXPORT_:
                if (ndyl < MAXDYL) {
                  uint32_t o = rd32(off + 8);
                  strncpy(dylibs[ndyl], (const char *)D + off + o, sizeof dylibs[0] - 1);
                  dylweak[ndyl] = (cmd == LC_LOAD_WEAK_);
                  ndyl++;
                }
                break;
              case LC_ENCRYPT_: {
                uint32_t id = rd32(off + 16);
                P("  ENCRYPTION_INFO cryptoff=0x%x cryptsize=0x%x cryptid=%u  -> %s\n", rd32(off + 8), rd32(off + 12), id,
                  id ? "TERENKRIPSI (FairPlay): harus pakai IPA yang sudah di-decrypt!" : "tidak terenkripsi (OK)");
                break; }
              case LC_DYLD_INFO_: case LC_DYLD_INFO_ONLY:
                for (j = 0; j < 10; j++) dyld_info[j] = rd32(off + 8 + j * 4);
                have_dyld = 1; break;
              case LC_SYMTAB_: for (j = 0; j < 4; j++) symtab[j] = rd32(off + 8 + j * 4); have_symtab = 1; break;
              case LC_DYSYMTAB_: for (j = 0; j < 18; j++) dysym[j] = rd32(off + 8 + j * 4); have_dysym = 1; break;
              case LC_UNIXTHREAD_:
                /* flavor, count, r0-r12, sp, lr, pc, cpsr */
                entry_pc = rd32(off + 8 + 4 * (2 + 15)); have_entry = 1; break;
              case LC_MAIN_: entry_pc = rd32(off + 8); have_entry = 1; break;
              case LC_VER_IPHONEOS_: { uint32_t v = rd32(off + 8), s2 = rd32(off + 12);
                P("  MIN_IPHONEOS %u.%u  SDK %u.%u\n", v >> 16, (v >> 8) & 255, s2 >> 16, (s2 >> 8) & 255); break; }
              case LC_UUID_: { char u[40]; int k; for (k = 0; k < 16; k++) sprintf(u + k * 2, "%02x", D[off + 8 + k]); P("  UUID %s\n", u); break; }
              case LC_CODE_SIG_: P("  CODE_SIGNATURE off=0x%x size=%u (diabaikan loader)\n", rd32(off + 8), rd32(off + 12)); break;
              case LC_FUNC_STARTS_: P("  FUNCTION_STARTS off=0x%x size=%u (berguna untuk Ghidra: daftar awal fungsi)\n", rd32(off + 8), rd32(off + 12)); break;
              default: break;
              }
              off += cs;
            }
            return 0;
          }

          static void report_layout(void) {
            int i;
            P("\n== segmen ==\n");
            for (i = 0; i < nseg; i++) {
              const Seg *s = &segs[i];
              P("  %-11s vm=0x%08x..0x%08x  file=0x%x+0x%x  zero-fill=0x%x  prot=%c%c%c\n", s->name, s->vmaddr, s->vmaddr + s->vmsize,
                s->fileoff, s->filesize, s->vmsize > s->filesize ? s->vmsize - s->filesize : 0,
                (s->prot & 1) ? 'r' : '-', (s->prot & 2) ? 'w' : '-', (s->prot & 4) ? 'x' : '-');
              if (s->vmaddr & 0xfff) P("    PERINGATAN: vmaddr tidak rata 4K\n");
            }
            P("  rentang yang harus di-map loader: 0x%08x..0x%08x (%u KB)\n", img_lo, img_hi, (img_hi - img_lo) / 1024);
            if (have_entry) P("  entry (LC_UNIXTHREAD pc) = 0x%08x%s\n", entry_pc & ~1u, (entry_pc & 1) ? " (thumb)" : " (ARM)");
            P("\n== library yang diminta binary (urutan = ordinal bind) ==\n");
            for (i = 0; i < ndyl; i++) P("  #%-2d %s%s\n", i + 1, dylibs[i], dylweak[i] ? "  (weak)" : "");
            P("\n== section penting ==\n");
            {
              static const char *want[] = { "__text", "__la_symbol_ptr", "__nl_symbol_ptr", "__mod_init_func", "__objc_classlist",
                "__objc_catlist", "__objc_selrefs", "__objc_classrefs", "__cfstring", "__bss", "__common", NULL };
              int k;
              for (k = 0; want[k]; k++) {
                const Sec *c = find_sec(want[k]);
                if (c) P("  %-18s %-8s addr=0x%08x size=0x%x (%u entri x4)\n", c->name, c->seg, c->addr, c->size, c->size / 4);
              }
            }
          }

          /* ---------------------------------------------------------------- lingkungan + uji mmap alamat tetap */
          static void report_env(void) {
            FILE *f; char line[512]; unsigned long mm = 0; unsigned long long cap = 0, mmv = 0; int i, have_cap = 0;
            P("\n== lingkungan device untuk map alamat tetap ==\n");
            P("  euid=%d\n", (int)geteuid());
            f = fopen("/proc/sys/vm/mmap_min_addr", "r");
            if (f) {
              if (fgets(line, sizeof line, f) && p_dec(line, &mmv)) { mm = (unsigned long)mmv; P("  vm.mmap_min_addr=%lu (0x%lx)  -> segmen game mulai di 0x%x\n", mm, mm, img_lo); }
              fclose(f);
            }
            f = fopen("/proc/self/status", "r");
            if (f) {
              while (fgets(line, sizeof line, f)) if (!strncmp(line, "CapEff:", 7) && p_hex(line + 7, &cap)) { have_cap = 1; break; }
              fclose(f);
              if (have_cap) P("  CapEff=0x%llx  CAP_SYS_RAWIO(bit17)=%s  (jika ya, mmap_min_addr dilewati)\n", cap, (cap >> 17) & 1 ? "ya" : "TIDAK");
            }
            P("  map proses ini yang bentrok dengan 0x%08x..0x%08x:\n", img_lo, img_hi);
            f = fopen("/proc/self/maps", "r");
            if (f) {
              int clash = 0;
              while (fgets(line, sizeof line, f)) {
                unsigned long long a, b; const char *q = p_hex(line, &a);
                if (q && *q == '-' && p_hex(q + 1, &b) && a < img_hi && b > img_lo) { P("    BENTROK: %s", line); clash = 1; }
              }
              fclose(f);
              g_clash = clash;
              if (!clash) P("    (tidak ada)\n");
              P("  catatan: loader asli harus di-link PIE atau -Wl,-Ttext-segment=0x10000000 supaya tidak menabrak area game\n");
            }
            P("  uji mmap PROT_NONE per segmen (langsung di-munmap lagi):\n");
            P("  catatan: kernel <4.17 tidak mengenal MAP_FIXED_NOREPLACE -> flag diabaikan, jadi cuma 'hint' yang ditolak jika alamat < mmap_min_addr EFEKTIF\n");
            P("           (sering 0x8000 karena CONFIG_LSM_MMAP_MIN_ADDR, walau sysctl bilang 4096). Karena itu dicoba juga MAP_FIXED sungguhan.\n");
            for (i = 0; i < nseg; i++) {
              const Seg *s = &segs[i];
              void *p; int ok1 = 0;
              if (!strcmp(s->name, "__PAGEZERO") || !strcmp(s->name, "__LINKEDIT") || !s->vmsize) continue;
              errno = 0;
              p = mmap((void *)(uintptr_t)s->vmaddr, s->vmsize, PROT_NONE, MAP_PRIVATE | MAP_ANONYMOUS | MAP_FIXED_NOREPLACE, -1, 0);
              if (p == MAP_FAILED) P("    %-8s 0x%08x size=0x%x : NOREPLACE/hint GAGAL (%s)\n", s->name, s->vmaddr, s->vmsize, strerror(errno));
              else if ((uintptr_t)p != s->vmaddr) { P("    %-8s 0x%08x : NOREPLACE/hint -> kernel memberi alamat lain (%p)\n", s->name, s->vmaddr, p); munmap(p, s->vmsize); }
              else { P("    %-8s 0x%08x size=0x%x : NOREPLACE/hint OK\n", s->name, s->vmaddr, s->vmsize); munmap(p, s->vmsize); ok1 = 1; }
              if (!ok1) {
                if (g_clash) { P("    %-8s MAP_FIXED dilewati: ada mapping yang menabrak (menimpa mapping lain tidak aman)\n", s->name); continue; }
                errno = 0;
                p = mmap((void *)(uintptr_t)s->vmaddr, s->vmsize, PROT_NONE, MAP_PRIVATE | MAP_ANONYMOUS | MAP_FIXED, -1, 0);
                if (p == MAP_FAILED) P("    %-8s MAP_FIXED GAGAL (%s)\n", s->name, strerror(errno));
                else if ((uintptr_t)p != s->vmaddr) { P("    %-8s MAP_FIXED aneh: dapat %p\n", s->name, p); munmap(p, s->vmsize); }
                else { P("    %-8s MAP_FIXED OK di 0x%08x size=0x%x  -> loader pakai MAP_FIXED (setelah cek /proc/self/maps kosong)\n", s->name, s->vmaddr, s->vmsize); munmap(p, s->vmsize); }
              }
            }
            if (!g_clash) {
              static const uint32_t lows[] = { 0x1000, 0x2000, 0x4000, 0x7000, 0x8000, 0x10000 };
              unsigned k;
              P("  batas bawah alamat (1 halaman, MAP_FIXED):\n");
              for (k = 0; k < sizeof lows / sizeof lows[0]; k++) {
                void *p; errno = 0;
                p = mmap((void *)(uintptr_t)lows[k], 4096, PROT_NONE, MAP_PRIVATE | MAP_ANONYMOUS | MAP_FIXED, -1, 0);
                if (p == MAP_FAILED) P("    0x%05x : GAGAL (%s)\n", lows[k], strerror(errno));
                else { P("    0x%05x : OK\n", lows[k]); munmap(p, 4096); }
              }
            }
          }

          /* ---------------------------------------------------------------- bind opcodes */
          static uint64_t uleb(const uint8_t **p, const uint8_t *e) {
            uint64_t r = 0; int sh = 0;
            while (*p < e) { uint8_t b = *(*p)++; if (sh < 64) r |= (uint64_t)(b & 0x7f) << sh; sh += 7; if (!(b & 0x80)) break; }
            return r;
          }
          static int64_t sleb(const uint8_t **p, const uint8_t *e) {
            int64_t r = 0; int sh = 0; uint8_t b = 0;
            while (*p < e) { b = *(*p)++; if (sh < 64) r |= (int64_t)(b & 0x7f) << sh; sh += 7; if (!(b & 0x80)) break; }
            if (sh < 64 && (b & 0x40)) r |= -((int64_t)1 << sh);
            return r;
          }
          static int usym_get(const char *name, int ord) {
            int i;
            for (i = 0; i < nusym; i++) if (strcmp(usyms[i].name, name) == 0) return i;
            if (nusym >= MAXSYM) return -1;
            memset(&usyms[nusym], 0, sizeof usyms[0]);
            strncpy(usyms[nusym].name, name, sizeof usyms[0].name - 1);
            usyms[nusym].ord = ord;
            return nusym++;
          }
          static void add_bind(const char *sym, int ord, int seg, uint64_t so, int kind) {
            uint32_t va; int u, s;
            if (seg < 0 || seg >= nseg || nbinds >= MAXBND) return;
            va = segs[seg].vmaddr + (uint32_t)so;
            u = usym_get(sym, ord);
            if (u < 0) return;
            if (kind == 0) usyms[u].nbind++; else if (kind == 1) usyms[u].nlazy++; else usyms[u].nweak++;
            if (kind != 2 && usyms[u].ord == 0) usyms[u].ord = ord;
            binds[nbinds].va = va; binds[nbinds].usym = u; binds[nbinds].kind = kind; nbinds++;
            s = sec_of_va(va);
            if (s >= 0) secbinds[s]++;
          }
          static void parse_binds(uint32_t off, uint32_t size, int kind) {
            const uint8_t *p, *e;
            char sym[96] = ""; int ord = 0, seg = 0; uint64_t so = 0;
            if (!size || (size_t)off + size > DS) return;
            p = D + off; e = p + size;
            while (p < e) {
              uint8_t b = *p++; int op = b & 0xF0, imm = b & 0x0F;
              switch (op) {
              case 0x00: if (kind == 1) break; return;
              case 0x10: ord = imm; break;
              case 0x20: ord = (int)uleb(&p, e); break;
              case 0x30: ord = imm ? (int)(int8_t)(0xF0 | imm) : 0; break;
              case 0x40: { size_t n = strnlen((const char *)p, (size_t)(e - p)); size_t c = n < sizeof sym - 1 ? n : sizeof sym - 1;
                memcpy(sym, p, c); sym[c] = 0; p += n + 1; break; }
              case 0x50: break;
              case 0x60: (void)sleb(&p, e); break;
              case 0x70: seg = imm; so = uleb(&p, e); break;
              case 0x80: so += uleb(&p, e); break;
              case 0x90: add_bind(sym, ord, seg, so, kind); so += 4; break;
              case 0xA0: add_bind(sym, ord, seg, so, kind); so += 4 + uleb(&p, e); break;
              case 0xB0: add_bind(sym, ord, seg, so, kind); so += 4 + (uint64_t)imm * 4; break;
              case 0xC0: { uint64_t cnt = uleb(&p, e), skip = uleb(&p, e), i;
                for (i = 0; i < cnt && i < 100000; i++) { add_bind(sym, ord, seg, so, kind); so += 4 + skip; } break; }
              default: P("  opcode bind tidak dikenal 0x%02x (kind=%d)\n", b, kind); return;
              }
            }
          }
          static const char *bind_name_at(uint32_t va) {
            int i;
            for (i = 0; i < nbinds; i++) if (binds[i].va == va) return usyms[binds[i].usym].name;
            return NULL;
          }

          /* ---------------------------------------------------------------- klasifikasi impor */
          static void *try_open(const char *p) {
            void *h = dlopen(p, RTLD_LAZY | RTLD_LOCAL);
            P("  dlopen %-36s : %s\n", p, h ? "OK" : dlerror());
            return h;
          }

          static const struct { const char *pfx; const char *why; } risky[] = {
            { "pthread_", "tipe/konstanta Darwin beda (mutex RECURSIVE=2 vs 1, ukuran struct, init statis bertanda 0x32AAABA7)" },
            { "setjmp", "jmp_buf Darwin armv7=112 byte < glibc 256 byte -> BUFFER OVERFLOW, pakai setjmp/longjmp buatan sendiri" },
            { "_setjmp", "jmp_buf Darwin lebih kecil dari glibc" },
            { "longjmp", "jmp_buf Darwin lebih kecil dari glibc" },
            { "sigaction", "layout struct sigaction + nomor sinyal beda" },
            { "sigaltstack", "layout stack_t beda" },
            { "socket", "konstanta AF_/SOCK_ sama untuk INET, tapi lihat sockaddr" },
            { "bind", "sockaddr_in Darwin punya sin_len di depan -> layout beda" },
            { "connect", "sockaddr_in Darwin punya sin_len di depan -> layout beda" },
            { "accept", "sockaddr Darwin punya sa_len" },
            { "setsockopt", "SOL_SOCKET=0xffff di Darwin vs 1 di Linux, nilai SO_* beda" },
            { "fcntl", "O_NONBLOCK dkk beda nilai (0x4 vs 0x800)" },
