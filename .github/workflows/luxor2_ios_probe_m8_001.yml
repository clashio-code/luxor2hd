          /* libm: iOS armv7 = softfp (float/double lewat r0-r3), armhf = hard-float. Tiap fungsi dibungkus pcs("aapcs").
           * Fungsi libm di-resolve lewat dlsym saat runtime (bukan link-time): glibc 2.38 memberi fmod/fmodf versi simbol GLIBC_2.38
           * sehingga binary yang dilink di runner baru menolak jalan di device glibc 2.37. */
          #define MATH_D1(X) X(sin) X(cos) X(tan) X(asin) X(acos) X(atan) X(exp) X(exp2) X(log) X(log10) X(sqrt) X(fabs) X(floor) X(ceil) X(round) X(trunc) X(rint)
          #define MATH_F1(X) X(sinf) X(cosf) X(tanf) X(asinf) X(acosf) X(atanf) X(expf) X(exp2f) X(logf) X(log10f) X(sqrtf) X(fabsf) X(floorf) X(ceilf) X(roundf) X(truncf) X(rintf)
          #define MATH_D2(X) X(atan2) X(pow) X(fmod)
          #define MATH_F2(X) X(atan2f) X(powf) X(fmodf)
          #define DEF_D1(n) static double (*p_##n)(double); SOFTFP static double sh_##n(double x) { return p_##n ? p_##n(x) : 0.0; }
          #define DEF_F1(n) static float (*p_##n)(float); SOFTFP static float sh_##n(float x) { return p_##n ? p_##n(x) : 0.0f; }
          #define DEF_D2(n) static double (*p_##n)(double, double); SOFTFP static double sh_##n(double x, double y) { return p_##n ? p_##n(x, y) : 0.0; }
          #define DEF_F2(n) static float (*p_##n)(float, float); SOFTFP static float sh_##n(float x, float y) { return p_##n ? p_##n(x, y) : 0.0f; }
          MATH_D1(DEF_D1) MATH_F1(DEF_F1) MATH_D2(DEF_D2) MATH_F2(DEF_F2)
          static double (*p_ldexp)(double, int);
          SOFTFP static double sh_ldexp(double x, int e) { return p_ldexp ? p_ldexp(x, e) : 0.0; }
          SOFTFP static double sh_strtod(const char *s, char **e) { return strtod(s, e); }
          SOFTFP static double sh_atof(const char *s) { return strtod(s, NULL); }
          static int g_math_missing;
          #define INIT_MATH(n) p_##n = (__typeof__(p_##n))dlsym(RTLD_DEFAULT, #n); if (!p_##n) { g_math_missing++; L("PERINGATAN: libm tidak punya %s\n", #n); }
          static void init_math(void) {
            dlopen("libm.so.6", RTLD_NOW | RTLD_GLOBAL);
            MATH_D1(INIT_MATH) MATH_F1(INIT_MATH) MATH_D2(INIT_MATH) MATH_F2(INIT_MATH) INIT_MATH(ldexp)
          }

          /* mach / dispatch / blocks */
          static uint64_t sh_mach_absolute_time(void) { struct timespec t; clock_gettime(CLOCK_MONOTONIC, &t); return (uint64_t)t.tv_sec * 1000000000ull + (uint64_t)t.tv_nsec; }
          static int sh_mach_timebase_info(uint32_t *tb) { tb[0] = 1; tb[1] = 1; return 0; }
          static int sh_semaphore_create(uint32_t task, uint32_t *out, int policy, int value) {
            sem_t *s = (sem_t *)malloc(sizeof(sem_t)); (void)task; (void)policy;
            if (!s) return 6;
            sem_init(s, 0, (unsigned)value); *out = (uint32_t)(uintptr_t)s; return 0;
          }
          static int sh_semaphore_destroy(uint32_t task, uint32_t sem) { sem_t *s = (sem_t *)(uintptr_t)sem; (void)task; if (s) { sem_destroy(s); free(s); } return 0; }
          static int sh_semaphore_signal(uint32_t sem) { sem_post((sem_t *)(uintptr_t)sem); return 0; }
          static int sh_semaphore_wait(uint32_t sem) { while (sem_wait((sem_t *)(uintptr_t)sem) != 0 && errno == EINTR) {} return 0; }
          static void call_block(void *blk) { uintptr_t fn = *(uintptr_t *)((char *)blk + 12); call_game4(fn, (uintptr_t)blk, 0, 0, 0); }
          static pthread_mutex_t g_once_mx;
          static void sh_dispatch_once(volatile long *pred, void *blk) {
            if (*pred == -1) return;
            pthread_mutex_lock(&g_once_mx);
            if (*pred != -1) { call_block(blk); *pred = -1; }
            pthread_mutex_unlock(&g_once_mx);
          }
          static void sh_dispatch_async(void *q, void *blk) { (void)q; L("[dispatch_async] dijalankan sinkron (M2)\n"); call_block(blk); }
          static void sh_memset_pattern16(void *dst, const void *pat, size_t len) { size_t i; for (i = 0; i < len; i++) ((uint8_t *)dst)[i] = ((const uint8_t *)pat)[i & 15]; }

          /* pthread: konstanta + ukuran struct Darwin beda dari glibc */
          #define DARWIN_MUTEX_SIG 0x32AAABA7u
          static void mx_fix(pthread_mutex_t *m) { if (*(volatile uint32_t *)m == DARWIN_MUTEX_SIG) pthread_mutex_init(m, NULL); }
          static int sh_mx_lock(pthread_mutex_t *m) { mx_fix(m); return pthread_mutex_lock(m); }
          static int sh_mx_unlock(pthread_mutex_t *m) { mx_fix(m); return pthread_mutex_unlock(m); }
          static int sh_mx_destroy(pthread_mutex_t *m) { mx_fix(m); return pthread_mutex_destroy(m); }
          static int sh_mxattr_settype(pthread_mutexattr_t *a, int t) {
            return pthread_mutexattr_settype(a, t == 2 ? PTHREAD_MUTEX_RECURSIVE : t == 1 ? PTHREAD_MUTEX_ERRORCHECK : PTHREAD_MUTEX_NORMAL);
          }
          static int sh_attr_setdetach(pthread_attr_t *a, int s) { return pthread_attr_setdetachstate(a, s == 2 ? PTHREAD_CREATE_DETACHED : PTHREAD_CREATE_JOINABLE); }
          static int sh_fcntl(int fd, int cmd, ...) {
            va_list ap; long arg; int r;
            va_start(ap, cmd); arg = va_arg(ap, long); va_end(ap);
            if (cmd == 4) {   /* F_SETFL: O_NONBLOCK 0x4->Linux, O_APPEND 0x8->Linux */
              long f = arg & ~0xCL;
              if (arg & 0x4) f |= O_NONBLOCK;
              if (arg & 0x8) f |= O_APPEND;
              return fcntl(fd, cmd, f);
            }
            r = fcntl(fd, cmd, arg);
            if (cmd == 3 && r >= 0) { int f = r & ~(O_NONBLOCK | O_APPEND); if (r & O_NONBLOCK) f |= 0x4; if (r & O_APPEND) f |= 0x8; r = f; }
            return r;
          }

