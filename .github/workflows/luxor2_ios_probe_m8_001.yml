            if (ry > 6000 || ry < -6000) ay = ry / 32767.0f;
            if (g_cur[DLEFT]) ax = -1;
            if (g_cur[DRIGHT]) ax = 1;
            if (g_cur[DUP]) ay = -1;
            if (g_cur[DDOWN]) ay = 1;
