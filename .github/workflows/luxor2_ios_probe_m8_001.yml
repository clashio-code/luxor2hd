          /* ============================================================ panggil kode game dengan aman (r9!)
           * iOS armv7: r9 = register scratch (callee boleh menimpa). Linux armhf: r9 = callee-saved, dipakai kompiler untuk variabel lokal.
           * Tiap panggilan loader -> kode game WAJIB lewat call_game4 supaya r9 (dan r4, r12) dipulihkan. Argumen ke-5 (d) lewat stack. */
          #ifdef __arm__
          extern uint32_t call_game4(uintptr_t fn, uintptr_t a, uintptr_t b, uintptr_t c, uintptr_t d);
          __asm__(
            ".text\n"
            ".arm\n"
            ".align 2\n"
            ".global call_game4\n"
            ".type call_game4, %function\n"
            "call_game4:\n"
            "  push {r4, r9, r12, lr}\n"
            "  mov r12, r0\n"
            "  mov r0, r1\n"
            "  mov r1, r2\n"
            "  mov r2, r3\n"
            "  ldr r3, [sp, #16]\n"
            "  blx r12\n"
            "  pop {r4, r9, r12, lr}\n"
            "  bx lr\n"
          );
          #else
          static uint32_t call_game4(uintptr_t fn, uintptr_t a, uintptr_t b, uintptr_t c, uintptr_t d) {
            return ((uint32_t (*)(uintptr_t, uintptr_t, uintptr_t, uintptr_t))fn)(a, b, c, d);
          }
          #endif

          /* ============================================================ log */
          static void wr(int fd, const char *b, int n) { ssize_t r = write(fd, b, (size_t)n); (void)r; }
          static void L(const char *fmt, ...) {
            char b[1536]; va_list ap; int n;
            va_start(ap, fmt); n = vsnprintf(b, sizeof b, fmt, ap); va_end(ap);
            if (n < 0) return;
            if (n > (int)sizeof b - 1) n = (int)sizeof b - 1;
            wr(1, b, n);
            if (g_logfd >= 0) wr(g_logfd, b, n);
          }

          /* parser angka sendiri: scanf/strto* di header glibc >=2.38 jadi __isoc23_* (butuh GLIBC_2.38, device cuma 2.37) */
          static const char *p_hex(const char *s, unsigned long long *out) {
            unsigned long long v = 0; int n = 0;
            while (*s == ' ' || *s == '\t') s++;
            for (;; s++, n++) {
              int c = (unsigned char)*s, d;
              if (c >= '0' && c <= '9') d = c - '0'; else if (c >= 'a' && c <= 'f') d = c - 'a' + 10;
              else if (c >= 'A' && c <= 'F') d = c - 'A' + 10; else break;
              v = v * 16 + (unsigned)d;
            }
            if (!n) return NULL;
            *out = v; return s;
          }
          static int p_dec(const char *s) { int v = 0; while (*s >= '0' && *s <= '9') v = v * 10 + (*s++ - '0'); return v; }
          /* pengganti atoi (atoi -> __isoc23_strtol@GLIBC_2.38 di toolchain baru; device hanya 2.37) */
          static double strtod_(const char *s) { return strtod(s, NULL); }
          static int p_int(const char *s) { int neg = 0; while (*s == ' ' || *s == '\t') s++; if (*s == '-') { neg = 1; s++; } else if (*s == '+') s++; return neg ? -p_dec(s) : p_dec(s); }

          /* ============================================================ shim: Darwin ctype */
          typedef struct { uint32_t nranges; void *ranges; } RuneRange;
          typedef struct {
            char magic[8]; char encoding[32]; void *sgetrune; void *sputrune; int32_t invalid_rune;
            uint32_t runetype[256]; int32_t maplower[256]; int32_t mapupper[256];
            RuneRange runetype_ext, maplower_ext, mapupper_ext; void *variable; int32_t variable_len; int32_t ncharclasses; void *charclasses;
          } RuneLocale;
          static RuneLocale g_rune;
          #define CT_A 0x00000100u
          #define CT_C 0x00000200u
          #define CT_D 0x00000400u
          #define CT_G 0x00000800u
          #define CT_L 0x00001000u
          #define CT_P 0x00002000u
          #define CT_S 0x00004000u
          #define CT_U 0x00008000u
          #define CT_X 0x00010000u
          #define CT_B 0x00020000u
          #define CT_R 0x00040000u
          static void init_rune(void) {
            int c;
            memcpy(g_rune.magic, "RuneMagA", 8); strcpy(g_rune.encoding, "NONE");
            for (c = 0; c < 256; c++) { g_rune.maplower[c] = c; g_rune.mapupper[c] = c; }
            for (c = 0; c < 128; c++) {
              uint32_t f = 0;
              if (c < 32 || c == 127) { f = CT_C; if (c == 9) f |= CT_S | CT_B; if (c >= 10 && c <= 13) f |= CT_S; }
              else if (c == 32) f = CT_B | CT_R | CT_S;
              else if (c >= '0' && c <= '9') f = CT_D | CT_G | CT_R | CT_X | (uint32_t)(c - '0');
              else if (c >= 'A' && c <= 'Z') { f = CT_A | CT_G | CT_R | CT_U; if (c <= 'F') f |= CT_X | (uint32_t)(c - 'A' + 10); g_rune.maplower[c] = c + 32; }
              else if (c >= 'a' && c <= 'z') { f = CT_A | CT_G | CT_R | CT_L; if (c <= 'f') f |= CT_X | (uint32_t)(c - 'a' + 10); g_rune.mapupper[c] = c - 32; }
              else f = CT_G | CT_R | CT_P;
              g_rune.runetype[c] = f;
            }
          }
          static int sh_maskrune(int c, unsigned long mask) { return (c >= 0 && c < 256) ? (int)(g_rune.runetype[c] & (uint32_t)mask) : 0; }
          static int sh_tolower(int c) { return (c >= 'A' && c <= 'Z') ? c + 32 : c; }
          static int sh_toupper(int c) { return (c >= 'a' && c <= 'z') ? c - 32 : c; }

