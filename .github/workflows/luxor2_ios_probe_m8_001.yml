          /* ---- format ala NSString ---- */
          static void fmt_ns(char *out, size_t n, const char *f, va_list ap) {
            size_t o = 0;
            while (*f && o + 1 < n) {
              char spec[32], t2[160]; int k = 0, ll = 0, r; const char *p = f; char c;
              if (*f != '%') { out[o++] = *f++; continue; }
              spec[k++] = *p++;
              while (*p && strchr("-+ #0123456789.", *p) && k < 20) spec[k++] = *p++;
              while (*p == 'l' || *p == 'h' || *p == 'z' || *p == 't' || *p == 'q') { if (*p == 'l' || *p == 'q') ll++; else if (*p == 'z' || *p == 't') ll = 1; p++; }
              c = *p;
              if (!c) break;
              p++; f = p;
              switch (c) {
              case '%': out[o++] = '%'; break;
              case '@': { const char *s = obj_cstr(va_arg(ap, U), t2, sizeof t2); r = snprintf(out + o, n - o, "%s", s); if (r > 0) o += (size_t)r; break; }
              case 'd': case 'i':
                if (ll >= 2) { long long v = va_arg(ap, long long); spec[k++] = 'l'; spec[k++] = 'l'; spec[k++] = 'd'; spec[k] = 0; r = snprintf(out + o, n - o, spec, v); }
                else { int v = va_arg(ap, int); spec[k++] = 'd'; spec[k] = 0; r = snprintf(out + o, n - o, spec, v); }
                if (r > 0) o += (size_t)r; break;
              case 'u': case 'x': case 'X': case 'o':
                if (ll >= 2) { unsigned long long v = va_arg(ap, unsigned long long); spec[k++] = 'l'; spec[k++] = 'l'; spec[k++] = c; spec[k] = 0; r = snprintf(out + o, n - o, spec, v); }
                else { unsigned v = va_arg(ap, unsigned); spec[k++] = c; spec[k] = 0; r = snprintf(out + o, n - o, spec, v); }
                if (r > 0) o += (size_t)r; break;
              case 'f': case 'F': case 'e': case 'E': case 'g': case 'G': { double v = va_arg(ap, double); spec[k++] = c; spec[k] = 0; r = snprintf(out + o, n - o, spec, v); if (r > 0) o += (size_t)r; break; }
              case 's': { const char *s = va_arg(ap, const char *); spec[k++] = 's'; spec[k] = 0; r = snprintf(out + o, n - o, spec, s ? s : "(null)"); if (r > 0) o += (size_t)r; break; }
              case 'c': { int v = va_arg(ap, int); out[o++] = (char)v; break; }
              case 'p': { void *v = va_arg(ap, void *); r = snprintf(out + o, n - o, "%p", v); if (r > 0) o += (size_t)r; break; }
              default: out[o++] = '%'; out[o++] = c; break;
              }
              if (o >= n) o = n - 1;
            }
            out[o < n ? o : n - 1] = 0;
          }
