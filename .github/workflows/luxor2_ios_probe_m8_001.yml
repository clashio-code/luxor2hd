            "  mov r0, r12\n"
            "  bl stub_hit_c\n"
            "  mov r0, #0\n"
            "  mov r1, #0\n"
            "  pop {r4, pc}\n"
            ".align 2\n"
            ".global align_call\n"
            ".type align_call, %function\n"
            "align_call:\n"
            "  push {r4, r5, r6, lr}\n"
            "  mov r4, sp\n"
            "  add r5, sp, #16\n"
            "  sub sp, sp, #64\n"
            "  bic sp, sp, #7\n"
            "  mov r6, #0\n"
            "1:\n"
            "  ldr lr, [r5, r6]\n"
            "  str lr, [sp, r6]\n"
            "  add r6, r6, #4\n"
            "  cmp r6, #64\n"
            "  blt 1b\n"
            "  blx ip\n"
            "  mov sp, r4\n"
            "  pop {r4, r5, r6, pc}\n"
            ".align 2\n"
            ".global sh_setjmp\n"
            ".type sh_setjmp, %function\n"
            "sh_setjmp:\n"
            "  mov ip, r0\n"
            "  stmia ip!, {r4-r11}\n"
            "  str sp, [ip], #4\n"
            "  str lr, [ip], #4\n"
            "  vstmia ip!, {d8-d15}\n"
            "  mov r0, #0\n"
            "  bx lr\n"
            ".align 2\n"
            ".global sh_longjmp\n"
            ".type sh_longjmp, %function\n"
            "sh_longjmp:\n"
            "  mov ip, r0\n"
            "  ldmia ip!, {r4-r11}\n"
            "  ldr sp, [ip], #4\n"
            "  ldr lr, [ip], #4\n"
            "  vldmia ip!, {d8-d15}\n"
            "  movs r0, r1\n"
            "  moveq r0, #1\n"
            "  bx lr\n"
          );
          #endif

          static void thunks_alloc(void) {
            g_thunk_bytes = (size_t)MAXSYM * THUNK_SZ;
            g_thunks = (uint8_t *)mmap(NULL, g_thunk_bytes, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANONYMOUS | MAP_32BIT, -1, 0);
            if (g_thunks == MAP_FAILED) { L("GAGAL mmap thunk: %s\n", strerror(errno)); exit(1); }
          }
          static void *stub_for(const char *name) {
            int idx = nstub++;
            uint32_t *w = (uint32_t *)(g_thunks + (size_t)idx * THUNK_SZ);
            stub_names[idx] = strdup(name);
          #ifdef __arm__
            w[0] = 0xE300C000u | (((uint32_t)idx & 0xF000u) << 4) | ((uint32_t)idx & 0xFFFu);   /* movw r12, #idx  */
            w[1] = 0xE51FF004u;                                                                  /* ldr pc, [pc,#-4] */
            w[2] = (uint32_t)(uintptr_t)stub_common;
          #else
            (void)w;
          #endif
            return g_thunks + (size_t)idx * THUNK_SZ;
          }
          static int g_nalign;
          static void *align_wrap(void *target) {
          #ifdef __arm__
            static int off = -1; int idx;
            if (off < 0) off = getenv("LUXOR_NOALIGN") ? 1 : 0;
            if (off || !target) return target;
            idx = MAXSYM - 1 - g_nalign;
            if (idx <= nstub + 1) return target;      /* kehabisan slot thunk: biarkan langsung */
            {
              uint32_t *w = (uint32_t *)(g_thunks + (size_t)idx * THUNK_SZ);
              w[0] = 0xE59FC000u;                      /* ldr ip, [pc]      -> w[2] (target)     */
              w[1] = 0xE59FF000u;                      /* ldr pc, [pc]      -> w[3] (align_call) */
              w[2] = (uint32_t)(uintptr_t)target;
              w[3] = (uint32_t)(uintptr_t)align_call;
            }
            g_nalign++;
