          /* ============================================================ stub / thunk (ARM-mode) */
          static uint8_t *g_thunks; static size_t g_thunk_bytes;
          static char *stub_names[MAXSYM]; static int nstub;
          static uint32_t stub_hits[MAXSYM];
          static const char *volatile g_last_stub = "(belum ada)";

          void stub_hit_c(unsigned idx, unsigned lr) __attribute__((used));
          void stub_hit_c(unsigned idx, unsigned lr) {
            const char *n = idx < (unsigned)nstub ? stub_names[idx] : "?";
            g_last_stub = n;
            if (idx < MAXSYM && stub_hits[idx]++ < 3) L("[STUB] %s dipanggil dari lr=0x%08x (hit ke-%u)\n", n, lr, stub_hits[idx]);
          }

          #ifdef __arm__
          extern void stub_common(void);
          extern void align_call(void);
          extern void sh_setjmp(void);
          extern void sh_longjmp(void);
          __asm__(
            ".text\n"
            ".arm\n"
            ".align 2\n"
            ".global stub_common\n"
            ".type stub_common, %function\n"
            "stub_common:\n"
