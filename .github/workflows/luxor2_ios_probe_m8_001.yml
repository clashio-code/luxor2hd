              else if (g_down && g_cur[BA] && (ax || ay)) touch_send("touchesMoved:withEvent:", g_cx, g_cy, 1);
              else if (g_down && RELEASED(BA)) { touch_send("touchesEnded:withEvent:", g_cx, g_cy, 3); g_down = 0; }
            } else {                                             /* ---- mode controller ---- */
              float sp = g_cur[BR1] ? 24.0f : 12.0f, nx = clampf(g_sx + ax * sp, 0, 1023);
              if (g_style == 1) {                                /* gaya "drag": tahan sentuh di rel, A = lepas (tembak) */
                if (nx != g_sx) { g_sx = nx; if (!g_down) { touch_send("touchesBegan:withEvent:", g_sx, g_rail_y, 0); g_down = 1; } else touch_send("touchesMoved:withEvent:", g_sx, g_rail_y, 1); }
                if (PRESSED(BA)) { if (!g_down) touch_send("touchesBegan:withEvent:", g_sx, g_rail_y, 0); touch_send("touchesEnded:withEvent:", g_sx, g_rail_y, 3); g_down = 0; }
