          static U find_native(U cls, const char *sel) {
            int n, i; U c;
            for (c = cls, n = 0; c && n < 64; n++, c = M32(c + 4)) {     /* 1) khusus kelas (urutan rantai) */
              ClsInfo *ci = ci_of(c);
              if (!ci) break;
              for (i = 0; nat_tab[i].sel; i++)
                if (nat_tab[i].cls && !strcmp(nat_tab[i].cls, ci->name) && !strcmp(nat_tab[i].sel, sel)) return P2A(nat_tab[i].fn);
            }
            for (i = 0; nat_tab[i].sel; i++)                              /* 2) generik NSObject */
              if (!nat_tab[i].cls && !strcmp(nat_tab[i].sel, sel)) return P2A(nat_tab[i].fn);
            return 0;
          }

          static uint64_t nil_native(void) { return 0; }

          U objc_lookup_cls_c(U cls, const char *sel, U lr) {
            U su = P2A(sel), imp; MCache *e = &g_mc[((cls >> 4) ^ (su >> 2)) & (MC_N - 1)];
            if (e->cls == cls && e->sel == su && e->imp) return e->imp;
            imp = find_method(cls, sel);
            if (!imp) imp = find_native(cls, sel);
            if (!imp) {
              ClsInfo *ci = ci_of(cls);
              if (g_unk_log < 800) { g_unk_log++; L("[MSG?] %c[%s %s] tidak ada (lr=0x%08x)\n", (ci && ci->is_meta) ? '+' : '-', ci ? ci->name : "?", sel, lr); }
              imp = (!strncmp(sel, "init", 4)) ? P2A(nat_self) : P2A(nil_native);   /* M6b: init* tak dikenal -> self (bukan nil) */
            }
            e->cls = 0; e->imp = imp; e->sel = su; e->cls = cls;
            return imp;
          }
          U objc_lookup_c(U self, const char *sel, U lr) {
            U cls;
            g_msg_self = self; g_msg_sel = sel; g_msg_lr = lr;
            cls = M32(self);
            if (g_trace_left > 0) {
              ClsInfo *ci = ci_of(cls); g_trace_left--;
              L("[msg] %c[%s %s] self=0x%08x lr=0x%08x\n", (ci && ci->is_meta) ? '+' : '-', ci ? ci->name : "?", sel, self, lr);
            }
            return objc_lookup_cls_c(cls, sel, lr);
          }
          void objc_nil_c(const char *sel, U lr) {
            U k = P2A(sel) ^ (lr * 2654435761u); unsigned h = (k >> 3) & 511;
            if (g_nilseen[h] == k) return;
            g_nilseen[h] = k;
            if (g_nil_log < 250) { g_nil_log++; L("[NIL] pesan ke nil: %s (lr=0x%08x)\n", sel, lr); }
          }

