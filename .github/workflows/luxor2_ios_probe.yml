name: build-armhf-luxor2-ios-diagnostic
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pasang toolchain ARM 32-bit
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Tulis sumber
        run: |
          mkdir -p src out/luxor2_ios/bin
          cat > src/machoprobe.c <<'EOF_C1'
          /* machoprobe - Milestone 1 port Luxor 2 HD iOS (Mach-O armv7 -> muOS armhf).
           * HANYA MEMBACA: mem-parse binary Mach-O 32-bit ARM lalu melaporkan:
           *   - layout segmen + cek apakah alamat tetap (0x1000...) bisa di-map di device
           *   - impor (bind / lazy-bind / weak-bind) dan klasifikasinya terhadap glibc + GL device
           *   - metadata ObjC (kelas + method + alamat IMP) untuk mencari titik masuk engine
           *   - (opsional) header file .pvr
           * Tidak menjalankan kode game. */
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdarg.h>
          #include <errno.h>
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <sys/utsname.h>
          #include <gnu/libc-version.h>

          #ifndef MAP_FIXED_NOREPLACE
          #define MAP_FIXED_NOREPLACE 0x100000
          #endif

          #define MH_MAGIC          0xfeedfaceu
          #define CPU_TYPE_ARM      12
          #define MH_PIE            0x200000u
          #define LC_SEGMENT_       0x1u
          #define LC_SYMTAB_        0x2u
          #define LC_UNIXTHREAD_    0x5u
          #define LC_DYSYMTAB_      0xbu
          #define LC_LOAD_DYLIB_    0xcu
          #define LC_UUID_          0x1bu
          #define LC_CODE_SIG_      0x1du
          #define LC_DYLD_INFO_     0x22u
          #define LC_ENCRYPT_       0x21u
          #define LC_VER_IPHONEOS_  0x25u
          #define LC_FUNC_STARTS_   0x26u
          #define LC_REQ_DYLD       0x80000000u
          #define LC_LOAD_WEAK_     (0x18u | LC_REQ_DYLD)
          #define LC_REEXPORT_      (0x1fu | LC_REQ_DYLD)
          #define LC_DYLD_INFO_ONLY (0x22u | LC_REQ_DYLD)
          #define LC_MAIN_          (0x28u | LC_REQ_DYLD)

          #define MAXSEG 16
          #define MAXSEC 64
          #define MAXDYL 32
          #define MAXSYM 1024
          #define MAXBND 8192

          typedef struct { char name[17]; uint32_t vmaddr, vmsize, fileoff, filesize; int prot, maxprot; } Seg;
          typedef struct { char name[17], seg[17]; uint32_t addr, size, offset, flags; int segidx; } Sec;
          typedef struct { char name[96]; int ord; int nlazy, nbind, nweak; } USym;
          typedef struct { uint32_t va; int usym; int kind; } BindRec;

          static FILE *rep;
          static uint8_t *D; static size_t DS;
          static Seg segs[MAXSEG]; static int nseg;
          static Sec secs[MAXSEC]; static int nsec;
          static char dylibs[MAXDYL][200]; static int dylweak[MAXDYL]; static int ndyl;
          static USym usyms[MAXSYM]; static int nusym;
          static BindRec binds[MAXBND]; static int nbinds;
          static int secbinds[MAXSEC];
          static uint32_t dyld_info[10]; static int have_dyld;
          static uint32_t symtab[4]; static uint32_t dysym[18]; static int have_symtab, have_dysym;
          static uint32_t entry_pc; static int have_entry;
          static uint32_t img_lo = 0xffffffffu, img_hi;

          static void P(const char *fmt, ...) {
            va_list ap;
            va_start(ap, fmt); vprintf(fmt, ap); va_end(ap);
            if (rep) { va_start(ap, fmt); vfprintf(rep, fmt, ap); va_end(ap); }
          }

          static uint32_t rd32(size_t off) {
            uint32_t v = 0;
            if (off + 4 <= DS) memcpy(&v, D + off, 4);
            return v;
          }

          /* alamat virtual game -> pointer di dalam file (hanya bagian yang file-backed) */
          static const uint8_t *va2p(uint32_t va) {
            int i;
            for (i = 0; i < nseg; i++) {
              const Seg *s = &segs[i];
              if (s->filesize && va >= s->vmaddr && va < s->vmaddr + s->filesize) {
                size_t off = (size_t)s->fileoff + (va - s->vmaddr);
                return off < DS ? D + off : NULL;
              }
            }
            return NULL;
          }
          static uint32_t R32(uint32_t va) {
            const uint8_t *p = va2p(va); uint32_t v = 0;
            if (p && (size_t)(p - D) + 4 <= DS) memcpy(&v, p, 4);
            return v;
          }
          static const char *vstr(uint32_t va) {
            const uint8_t *p = va2p(va);
            return p ? (const char *)p : "?";
          }
          static Sec *find_sec(const char *name) {
            int i;
            for (i = 0; i < nsec; i++) if (strcmp(secs[i].name, name) == 0) return &secs[i];
            return NULL;
          }
          static int sec_of_va(uint32_t va) {
            int i;
            for (i = 0; i < nsec; i++) if (va >= secs[i].addr && va < secs[i].addr + secs[i].size) return i;
            return -1;
          }
          static const char *base_name(const char *p) { const char *s = strrchr(p, '/'); return s ? s + 1 : p; }

          /* ---------------------------------------------------------------- header + load commands */
          static int parse_macho(void) {
            uint32_t magic, cpu, sub, ft, ncmds, sizeofcmds, flags, off, i, j;
            if (DS < 28) { P("file terlalu kecil\n"); return -1; }
            magic = rd32(0); cpu = rd32(4); sub = rd32(8); ft = rd32(12); ncmds = rd32(16); sizeofcmds = rd32(20); flags = rd32(24);
            if (magic != MH_MAGIC) {
              if (magic == 0xbebafecau || magic == 0xcafebabeu) P("file ini FAT/universal binary: ekstrak slice armv7 dulu (lipo -thin armv7)\n");
              else P("bukan Mach-O 32-bit little-endian (magic=0x%08x)\n", magic);
              return -1;
            }
            if ((int)cpu != CPU_TYPE_ARM) { P("bukan ARM (cputype=%u)\n", cpu); return -1; }
            P("== header ==\n");
            P("  cputype=ARM subtype=%u (%s) filetype=%u (%s) ncmds=%u sizeofcmds=%u\n", sub,
              sub == 9 ? "armv7" : sub == 11 ? "armv7s" : sub == 6 ? "armv6" : "?", ft,
              ft == 2 ? "EXECUTE" : ft == 6 ? "DYLIB" : "?", ncmds, sizeofcmds);
            P("  flags=0x%08x  %s\n", flags, (flags & MH_PIE) ? "PIE (bisa direlokasi)" : "NON-PIE: harus di-map di alamat asli");
            off = 28;
            for (i = 0; i < ncmds && off + 8 <= DS; i++) {
              uint32_t cmd = rd32(off), cs = rd32(off + 4);
              if (cs < 8 || off + cs > DS) { P("load command rusak (idx %u)\n", i); return -1; }
              switch (cmd) {
              case LC_SEGMENT_: {
                Seg *s; uint32_t nsc;
                if (nseg >= MAXSEG) break;
                s = &segs[nseg];
                memcpy(s->name, D + off + 8, 16); s->name[16] = 0;
                s->vmaddr = rd32(off + 24); s->vmsize = rd32(off + 28); s->fileoff = rd32(off + 32); s->filesize = rd32(off + 36);
                s->maxprot = (int)rd32(off + 40); s->prot = (int)rd32(off + 44);
                nsc = rd32(off + 48);
                for (j = 0; j < nsc && nsec < MAXSEC; j++) {
                  size_t so = off + 56 + (size_t)j * 68;
                  Sec *c = &secs[nsec++];
                  if (so + 68 > DS) break;
                  memcpy(c->name, D + so, 16); c->name[16] = 0;
                  memcpy(c->seg, D + so + 16, 16); c->seg[16] = 0;
                  c->addr = rd32(so + 32); c->size = rd32(so + 36); c->offset = rd32(so + 40); c->flags = rd32(so + 56);
                  c->segidx = nseg;
                }
                if (strcmp(s->name, "__PAGEZERO") != 0 && strcmp(s->name, "__LINKEDIT") != 0) {
                  if (s->vmaddr < img_lo) img_lo = s->vmaddr;
                  if (s->vmaddr + s->vmsize > img_hi) img_hi = s->vmaddr + s->vmsize;
                }
                nseg++;
                break; }
              case LC_LOAD_DYLIB_: case LC_LOAD_WEAK_: case LC_REEXPORT_:
                if (ndyl < MAXDYL) {
                  uint32_t o = rd32(off + 8);
                  strncpy(dylibs[ndyl], (const char *)D + off + o, sizeof dylibs[0] - 1);
                  dylweak[ndyl] = (cmd == LC_LOAD_WEAK_);
                  ndyl++;
                }
                break;
              case LC_ENCRYPT_: {
                uint32_t id = rd32(off + 16);
                P("  ENCRYPTION_INFO cryptoff=0x%x cryptsize=0x%x cryptid=%u  -> %s\n", rd32(off + 8), rd32(off + 12), id,
                  id ? "TERENKRIPSI (FairPlay): harus pakai IPA yang sudah di-decrypt!" : "tidak terenkripsi (OK)");
                break; }
              case LC_DYLD_INFO_: case LC_DYLD_INFO_ONLY:
                for (j = 0; j < 10; j++) dyld_info[j] = rd32(off + 8 + j * 4);
                have_dyld = 1; break;
              case LC_SYMTAB_: for (j = 0; j < 4; j++) symtab[j] = rd32(off + 8 + j * 4); have_symtab = 1; break;
              case LC_DYSYMTAB_: for (j = 0; j < 18; j++) dysym[j] = rd32(off + 8 + j * 4); have_dysym = 1; break;
              case LC_UNIXTHREAD_:
                /* flavor, count, r0-r12, sp, lr, pc, cpsr */
                entry_pc = rd32(off + 8 + 4 * (2 + 15)); have_entry = 1; break;
              case LC_MAIN_: entry_pc = rd32(off + 8); have_entry = 1; break;
              case LC_VER_IPHONEOS_: { uint32_t v = rd32(off + 8), s2 = rd32(off + 12);
                P("  MIN_IPHONEOS %u.%u  SDK %u.%u\n", v >> 16, (v >> 8) & 255, s2 >> 16, (s2 >> 8) & 255); break; }
              case LC_UUID_: { char u[40]; int k; for (k = 0; k < 16; k++) sprintf(u + k * 2, "%02x", D[off + 8 + k]); P("  UUID %s\n", u); break; }
              case LC_CODE_SIG_: P("  CODE_SIGNATURE off=0x%x size=%u (diabaikan loader)\n", rd32(off + 8), rd32(off + 12)); break;
              case LC_FUNC_STARTS_: P("  FUNCTION_STARTS off=0x%x size=%u (berguna untuk Ghidra: daftar awal fungsi)\n", rd32(off + 8), rd32(off + 12)); break;
              default: break;
              }
              off += cs;
            }
            return 0;
          }

          static void report_layout(void) {
            int i;
            P("\n== segmen ==\n");
            for (i = 0; i < nseg; i++) {
              const Seg *s = &segs[i];
              P("  %-11s vm=0x%08x..0x%08x  file=0x%x+0x%x  zero-fill=0x%x  prot=%c%c%c\n", s->name, s->vmaddr, s->vmaddr + s->vmsize,
                s->fileoff, s->filesize, s->vmsize > s->filesize ? s->vmsize - s->filesize : 0,
                (s->prot & 1) ? 'r' : '-', (s->prot & 2) ? 'w' : '-', (s->prot & 4) ? 'x' : '-');
              if (s->vmaddr & 0xfff) P("    PERINGATAN: vmaddr tidak rata 4K\n");
            }
            P("  rentang yang harus di-map loader: 0x%08x..0x%08x (%u KB)\n", img_lo, img_hi, (img_hi - img_lo) / 1024);
            if (have_entry) P("  entry (LC_UNIXTHREAD pc) = 0x%08x%s\n", entry_pc & ~1u, (entry_pc & 1) ? " (thumb)" : " (ARM)");
            P("\n== library yang diminta binary (urutan = ordinal bind) ==\n");
            for (i = 0; i < ndyl; i++) P("  #%-2d %s%s\n", i + 1, dylibs[i], dylweak[i] ? "  (weak)" : "");
            P("\n== section penting ==\n");
            {
              static const char *want[] = { "__text", "__la_symbol_ptr", "__nl_symbol_ptr", "__mod_init_func", "__objc_classlist",
                "__objc_catlist", "__objc_selrefs", "__objc_classrefs", "__cfstring", "__bss", "__common", NULL };
              int k;
              for (k = 0; want[k]; k++) {
                const Sec *c = find_sec(want[k]);
                if (c) P("  %-18s %-8s addr=0x%08x size=0x%x (%u entri x4)\n", c->name, c->seg, c->addr, c->size, c->size / 4);
              }
            }
          }

          /* ---------------------------------------------------------------- lingkungan + uji mmap alamat tetap */
          static void report_env(void) {
            FILE *f; char line[512]; unsigned long mm = 0; unsigned long long cap = 0; int i, have_cap = 0;
            P("\n== lingkungan device untuk map alamat tetap ==\n");
            P("  euid=%d\n", (int)geteuid());
            f = fopen("/proc/sys/vm/mmap_min_addr", "r");
            if (f) { if (fscanf(f, "%lu", &mm) == 1) P("  vm.mmap_min_addr=%lu (0x%lx)  -> segmen game mulai di 0x%x\n", mm, mm, img_lo); fclose(f); }
            f = fopen("/proc/self/status", "r");
            if (f) {
              while (fgets(line, sizeof line, f)) if (sscanf(line, "CapEff: %llx", &cap) == 1) { have_cap = 1; break; }
              fclose(f);
              if (have_cap) P("  CapEff=0x%llx  CAP_SYS_RAWIO(bit17)=%s  (jika ya, mmap_min_addr dilewati)\n", cap, (cap >> 17) & 1 ? "ya" : "TIDAK");
            }
            P("  map proses ini yang bentrok dengan 0x%08x..0x%08x:\n", img_lo, img_hi);
            f = fopen("/proc/self/maps", "r");
            if (f) {
              int clash = 0;
              while (fgets(line, sizeof line, f)) {
                unsigned long a, b;
                if (sscanf(line, "%lx-%lx", &a, &b) == 2 && a < img_hi && b > img_lo) { P("    BENTROK: %s", line); clash = 1; }
              }
              fclose(f);
              if (!clash) P("    (tidak ada)\n");
              P("  catatan: loader asli harus di-link PIE atau -Wl,-Ttext-segment=0x10000000 supaya tidak menabrak area game\n");
            }
            P("  uji mmap PROT_NONE + MAP_FIXED_NOREPLACE per segmen (langsung di-munmap lagi):\n");
            for (i = 0; i < nseg; i++) {
              const Seg *s = &segs[i];
              void *p;
              if (!strcmp(s->name, "__PAGEZERO") || !strcmp(s->name, "__LINKEDIT") || !s->vmsize) continue;
              errno = 0;
              p = mmap((void *)(uintptr_t)s->vmaddr, s->vmsize, PROT_NONE, MAP_PRIVATE | MAP_ANONYMOUS | MAP_FIXED_NOREPLACE, -1, 0);
              if (p == MAP_FAILED) P("    %-8s 0x%08x size=0x%x : GAGAL (%s)\n", s->name, s->vmaddr, s->vmsize, strerror(errno));
              else if ((uintptr_t)p != s->vmaddr) { P("    %-8s 0x%08x : kernel memberi alamat lain (%p) -> TIDAK bisa\n", s->name, s->vmaddr, p); munmap(p, s->vmsize); }
              else { P("    %-8s 0x%08x size=0x%x : OK\n", s->name, s->vmaddr, s->vmsize); munmap(p, s->vmsize); }
            }
          }

          /* ---------------------------------------------------------------- bind opcodes */
          static uint64_t uleb(const uint8_t **p, const uint8_t *e) {
            uint64_t r = 0; int sh = 0;
            while (*p < e) { uint8_t b = *(*p)++; if (sh < 64) r |= (uint64_t)(b & 0x7f) << sh; sh += 7; if (!(b & 0x80)) break; }
            return r;
          }
          static int64_t sleb(const uint8_t **p, const uint8_t *e) {
            int64_t r = 0; int sh = 0; uint8_t b = 0;
            while (*p < e) { b = *(*p)++; if (sh < 64) r |= (int64_t)(b & 0x7f) << sh; sh += 7; if (!(b & 0x80)) break; }
            if (sh < 64 && (b & 0x40)) r |= -((int64_t)1 << sh);
            return r;
          }
          static int usym_get(const char *name, int ord) {
            int i;
            for (i = 0; i < nusym; i++) if (strcmp(usyms[i].name, name) == 0) return i;
            if (nusym >= MAXSYM) return -1;
            memset(&usyms[nusym], 0, sizeof usyms[0]);
            strncpy(usyms[nusym].name, name, sizeof usyms[0].name - 1);
            usyms[nusym].ord = ord;
            return nusym++;
          }
          static void add_bind(const char *sym, int ord, int seg, uint64_t so, int kind) {
            uint32_t va; int u, s;
            if (seg < 0 || seg >= nseg || nbinds >= MAXBND) return;
            va = segs[seg].vmaddr + (uint32_t)so;
            u = usym_get(sym, ord);
            if (u < 0) return;
            if (kind == 0) usyms[u].nbind++; else if (kind == 1) usyms[u].nlazy++; else usyms[u].nweak++;
            if (kind != 2 && usyms[u].ord == 0) usyms[u].ord = ord;
            binds[nbinds].va = va; binds[nbinds].usym = u; binds[nbinds].kind = kind; nbinds++;
            s = sec_of_va(va);
            if (s >= 0) secbinds[s]++;
          }
          static void parse_binds(uint32_t off, uint32_t size, int kind) {
            const uint8_t *p, *e;
            char sym[96] = ""; int ord = 0, seg = 0; uint64_t so = 0;
            if (!size || (size_t)off + size > DS) return;
            p = D + off; e = p + size;
            while (p < e) {
              uint8_t b = *p++; int op = b & 0xF0, imm = b & 0x0F;
              switch (op) {
              case 0x00: if (kind == 1) break; return;
              case 0x10: ord = imm; break;
              case 0x20: ord = (int)uleb(&p, e); break;
              case 0x30: ord = imm ? (int)(int8_t)(0xF0 | imm) : 0; break;
              case 0x40: { size_t n = strnlen((const char *)p, (size_t)(e - p)); size_t c = n < sizeof sym - 1 ? n : sizeof sym - 1;
                memcpy(sym, p, c); sym[c] = 0; p += n + 1; break; }
              case 0x50: break;
              case 0x60: (void)sleb(&p, e); break;
              case 0x70: seg = imm; so = uleb(&p, e); break;
              case 0x80: so += uleb(&p, e); break;
              case 0x90: add_bind(sym, ord, seg, so, kind); so += 4; break;
              case 0xA0: add_bind(sym, ord, seg, so, kind); so += 4 + uleb(&p, e); break;
              case 0xB0: add_bind(sym, ord, seg, so, kind); so += 4 + (uint64_t)imm * 4; break;
              case 0xC0: { uint64_t cnt = uleb(&p, e), skip = uleb(&p, e), i;
                for (i = 0; i < cnt && i < 100000; i++) { add_bind(sym, ord, seg, so, kind); so += 4 + skip; } break; }
              default: P("  opcode bind tidak dikenal 0x%02x (kind=%d)\n", b, kind); return;
              }
            }
          }
          static const char *bind_name_at(uint32_t va) {
            int i;
            for (i = 0; i < nbinds; i++) if (binds[i].va == va) return usyms[binds[i].usym].name;
            return NULL;
          }

          /* ---------------------------------------------------------------- klasifikasi impor */
          static void *try_open(const char *p) {
            void *h = dlopen(p, RTLD_LAZY | RTLD_LOCAL);
            P("  dlopen %-36s : %s\n", p, h ? "OK" : dlerror());
            return h;
          }

          static const struct { const char *pfx; const char *why; } risky[] = {
            { "pthread_", "tipe/konstanta Darwin beda (mutex RECURSIVE=2 vs 1, ukuran struct, init statis bertanda 0x32AAABA7)" },
            { "setjmp", "jmp_buf Darwin armv7=112 byte < glibc 256 byte -> BUFFER OVERFLOW, pakai setjmp/longjmp buatan sendiri" },
            { "_setjmp", "jmp_buf Darwin lebih kecil dari glibc" },
            { "longjmp", "jmp_buf Darwin lebih kecil dari glibc" },
            { "sigaction", "layout struct sigaction + nomor sinyal beda" },
            { "sigaltstack", "layout stack_t beda" },
            { "socket", "konstanta AF_/SOCK_ sama untuk INET, tapi lihat sockaddr" },
            { "bind", "sockaddr_in Darwin punya sin_len di depan -> layout beda" },
            { "connect", "sockaddr_in Darwin punya sin_len di depan -> layout beda" },
            { "accept", "sockaddr Darwin punya sa_len" },
            { "setsockopt", "SOL_SOCKET=0xffff di Darwin vs 1 di Linux, nilai SO_* beda" },
            { "fcntl", "O_NONBLOCK dkk beda nilai (0x4 vs 0x800)" },
            { "getifaddrs", "sockaddr_dl/sa_len beda" },
            { "setxattr", "Darwin punya argumen tambahan (position, options)" },
            { "select", "fd_set sama, tapi errno beda" },
            { "strerror", "nomor errno Darwin beda dari Linux" },
            { "strsignal", "nomor sinyal Darwin beda" },
            { "fopen", "FILE* opaque -> aman selama semua lewat wrapper; ___stderrp/___stdinp perlu variabel data" },
            { NULL, NULL }
          };
          static const struct { const char *name; const char *hint; } darwin_hint[] = {
            { "__error", "errno: wrapper -> __errno_location (+ terjemah nilai errno Darwin<->Linux)" },
            { "__DefaultRuneLocale", "tabel ctype Darwin: sediakan data _RuneLocale sendiri" },
            { "__maskrune", "isalpha/isdigit dll inline Darwin: implementasi sendiri" },
            { "__tolower", "ctype Darwin: implementasi sendiri" },
            { "__stderrp", "variabel data: arahkan ke stderr glibc" },
            { "__stdinp", "variabel data: arahkan ke stdin glibc" },
            { "__assert_rtn", "-> __assert_fail (argumen beda)" },
            { "mach_absolute_time", "-> clock_gettime(CLOCK_MONOTONIC) dalam ns" },
            { "mach_timebase_info", "-> isi numer=denom=1" },
            { "mach_task_self_", "variabel data mach: isi dummy" },
            { "semaphore_create", "-> sem_t / pthread cond" }, { "semaphore_destroy", "-> sem_destroy" },
            { "semaphore_signal", "-> sem_post" }, { "semaphore_wait", "-> sem_wait" },
            { "dispatch_async", "-> thread pool / antrian sederhana" }, { "dispatch_once", "-> pthread_once" },
            { "_dispatch_main_q", "variabel data libdispatch: objek dummy" },
            { "_Block_copy", "libBlocksRuntime atau implementasi sendiri" }, { "_Block_object_assign", "libBlocksRuntime" },
            { "_Block_object_dispose", "libBlocksRuntime" }, { "_NSConcreteGlobalBlock", "variabel data Blocks" },
            { "_NSConcreteStackBlock", "variabel data Blocks" },
            { "CC_MD5", "CommonCrypto: implementasi MD5 sendiri" }, { "CC_SHA1", "CommonCrypto: implementasi SHA1 sendiri" },
            { "memset_pattern16", "fungsi Darwin: loop biasa" },
            { "sysctl", "dihapus dari glibc >=2.32: stub" }, { "sysctlbyname", "stub (hw.machine, dll)" },
            { "_Znwm", "size_t di-mangle 'm' (unsigned long) di iOS armv7, 'j' di glibc armhf -> alias ke _Znwj" },
            { "_Znam", "size_t di-mangle 'm' di iOS armv7 -> alias ke _Znaj" },
            { "_ZnwmRKSt9nothrow_t", "mangling size_t 'm' -> alias ke _ZnwjRKSt9nothrow_t" },
            { "_ZnamRKSt9nothrow_t", "mangling size_t 'm' -> alias ke _ZnajRKSt9nothrow_t" },
            { "__divsi3", "helper libgcc: link dari libgcc.a atau alias ke __aeabi_idiv" }, { "__udivsi3", "helper libgcc: alias ke __aeabi_uidiv" },
            { "__modsi3", "helper libgcc: link dari libgcc.a" }, { "__umodsi3", "helper libgcc: link dari libgcc.a" },
            { "__divdi3", "helper libgcc 64-bit: link dari libgcc.a (__aeabi_ldivmod)" }, { "__udivdi3", "helper libgcc 64-bit: link dari libgcc.a" },
            { "__umoddi3", "helper libgcc 64-bit: link dari libgcc.a" },
            { "__fixdfdi", "helper libgcc float<->int64: link dari libgcc.a" }, { "__fixsfdi", "helper libgcc: link dari libgcc.a" },
            { "__floatdidf", "helper libgcc: link dari libgcc.a" }, { "__floatdisf", "helper libgcc: link dari libgcc.a" },
            { "__floatundidf", "helper libgcc: link dari libgcc.a" }, { "__floatundisf", "helper libgcc: link dari libgcc.a" },
            { "dyld_stub_binder", "tidak perlu: loader mengisi lazy pointer langsung" },
            { "_dyld_register_func_for_add_image", "stub no-op" },
            { "__Unwind_SjLj_Register", "iOS armv7 pakai SjLj; glibc armhf pakai EHABI -> implementasi rantai SjLj sendiri" },
            { "__Unwind_SjLj_Unregister", "idem" }, { "__Unwind_SjLj_Resume", "dipanggil hanya saat unwinding (cek apakah ada __cxa_throw)" },
            { "__gxx_personality_sj0", "hanya dipakai saat unwinding SjLj" },
            { NULL, NULL }
          };
          static const char *hint_for(const char *n) {
            int i; const char *m = n[0] == '_' ? n + 1 : n;
            for (i = 0; darwin_hint[i].name; i++) if (!strcmp(darwin_hint[i].name, n) || !strcmp(darwin_hint[i].name, m)) return darwin_hint[i].hint;
            return NULL;
          }
          static const char *risk_for(const char *n) {
            int i; const char *m = n[0] == '_' ? n + 1 : n;
            for (i = 0; risky[i].pfx; i++) if (strncmp(m, risky[i].pfx, strlen(risky[i].pfx)) == 0) return risky[i].why;
            return NULL;
          }

          static int is_crt_lib(const char *l) {
            return !strncmp(l, "libSystem", 9) || !strncmp(l, "libgcc_s", 8) || !strncmp(l, "libstdc++", 9) || !strncmp(l, "libc++", 6);
          }
          static int cmp_sym(const void *a, const void *b) { return strcmp(*(char *const *)a, *(char *const *)b); }
          static int cmp_sym_kc(const void *a, const void *b) { return strcmp((const char *)a, (const char *)b); }

          static void classify(void *h_gles1, void *h_gles2, void *h_mali, void *h_gl4es) {
            int i, nundef = 0;
            const char *objc_cls[MAXSYM], *objc_rt[MAXSYM];
            int n_objc_cls = 0, n_objc_rt = 0;
            int n_ok = 0, n_risk = 0, n_miss = 0, n_hint = 0;
            const char *l_ok[MAXSYM], *l_risk[MAXSYM], *l_miss[MAXSYM];
            struct { char lib[64]; int n; } fw[MAXDYL]; int nfw = 0;
            int gl_total = 0, gl_any = 0, gl_none = 0;

            P("\n== bind ==\n");
            if (have_dyld) {
              P("  dyld_info: rebase(%u B) bind(%u B) weak(%u B) lazy(%u B) export(%u B)\n", dyld_info[1], dyld_info[3], dyld_info[5], dyld_info[7], dyld_info[9]);
              P("  rebase kosong -> %s\n", dyld_info[1] == 0 ? "tidak ada relokasi: binary HARUS di alamat aslinya" : "ada relokasi");
              parse_binds(dyld_info[2], dyld_info[3], 0);
              parse_binds(dyld_info[4], dyld_info[5], 2);   /* weak_bind_off = idx 4 */
              parse_binds(dyld_info[6], dyld_info[7], 1);
            } else P("  tidak ada LC_DYLD_INFO (binary lama?) - perlu parser symtab+indirect, belum didukung probe ini\n");
            if (have_dysym) nundef = (int)dysym[5];
            P("  total titik bind=%d  simbol unik=%d  (undefined di symtab=%d)\n", nbinds, nusym, nundef);
            P("  titik bind per section:\n");
            for (i = 0; i < nsec; i++) if (secbinds[i]) P("    %-20s %d\n", secs[i].name, secbinds[i]);

            for (i = 0; i < nusym; i++) {
              const USym *u = &usyms[i];
              const char *lib = (u->ord >= 1 && u->ord <= ndyl) ? base_name(dylibs[u->ord - 1]) : (u->ord == 0 ? "(self/weak)" : "(flat)");
              const char *n = u->name;
              if (!strncmp(n, "_OBJC_", 6)) { objc_cls[n_objc_cls++] = n; continue; }
              if (!strncmp(lib, "libobjc", 7) || !strncmp(n, "__objc_", 7) || !strncmp(n, "___objc_", 8)) { objc_rt[n_objc_rt++] = n; continue; }
              if (is_crt_lib(lib) || !strcmp(lib, "(self/weak)")) {
                const char *m = n[0] == '_' ? n + 1 : n;
                if (hint_for(n)) { l_miss[n_miss++] = n; n_hint++; continue; }
                if (risk_for(n) && dlsym(RTLD_DEFAULT, m)) { l_risk[n_risk++] = n; continue; }
                if (dlsym(RTLD_DEFAULT, m)) { l_ok[n_ok++] = n; continue; }
                l_miss[n_miss++] = n;
                continue;
              }
              {
                int k;
                for (k = 0; k < nfw; k++) if (!strcmp(fw[k].lib, lib)) break;
                if (k == nfw && nfw < MAXDYL) { strncpy(fw[nfw].lib, lib, 63); fw[nfw].lib[63] = 0; fw[nfw].n = 0; nfw++; }
                if (k < MAXDYL) fw[k].n++;
              }
            }

            P("\n=== klasifikasi simbol libSystem/libgcc_s/libstdc++ ===\n");
            P("  aman (ada di glibc, ABI sama)=%d | ada tapi ABI beda (perlu wrapper)=%d | perlu shim Darwin / tidak ada=%d\n", n_ok, n_risk, n_miss);
            qsort(l_risk, (size_t)n_risk, sizeof l_risk[0], cmp_sym);
            qsort(l_miss, (size_t)n_miss, sizeof l_miss[0], cmp_sym);
            P("\n-- ABI-RISK (%d)\n", n_risk);
            for (i = 0; i < n_risk; i++) P("  %-28s %s\n", l_risk[i], risk_for(l_risk[i]));
            P("\n-- PERLU SHIM / TIDAK ADA (%d, %d punya petunjuk)\n", n_miss, n_hint);
            for (i = 0; i < n_miss; i++) { const char *h = hint_for(l_miss[i]); P("  %-28s %s\n", l_miss[i], h ? h : "(tidak ada di glibc device)"); }
            qsort(l_ok, (size_t)n_ok, sizeof l_ok[0], cmp_sym);
            P("\n-- AMAN (%d)\n ", n_ok);
            for (i = 0; i < n_ok; i++) P(" %s", l_ok[i]);
            P("\n");

            P("\n=== runtime ObjC (%d fungsi/data) - butuh mini-runtime ===\n ", n_objc_rt);
            qsort(objc_rt, (size_t)n_objc_rt, sizeof objc_rt[0], cmp_sym);
            for (i = 0; i < n_objc_rt; i++) P(" %s", objc_rt[i]);
            P("\n");

            P("\n=== kelas Apple yang direferensikan (%d) - butuh handler objc_msgSend ===\n", n_objc_cls);
            {
              typedef struct { char key[160]; const char *nm; } KC;
              static KC kc[MAXSYM]; char last[64] = "";
              for (i = 0; i < n_objc_cls; i++) {
                const char *n = objc_cls[i], *c = strstr(n, "$_"); int k, ord = 0;
                for (k = 0; k < nusym; k++) if (!strcmp(usyms[k].name, n)) { ord = usyms[k].ord; break; }
                snprintf(kc[i].key, sizeof kc[i].key, "%s|%s", (ord >= 1 && ord <= ndyl) ? base_name(dylibs[ord - 1]) : "?", c ? c + 2 : n);
                kc[i].nm = c ? c + 2 : n;
              }
              qsort(kc, (size_t)n_objc_cls, sizeof kc[0], cmp_sym_kc);
              for (i = 0; i < n_objc_cls; i++) {
                char lb[64]; const char *bar = strchr(kc[i].key, '|');
                size_t ln = (size_t)(bar - kc[i].key); if (ln > 63) ln = 63;
                memcpy(lb, kc[i].key, ln); lb[ln] = 0;
                if (strcmp(last, lb)) { P("\n  [%s]", lb); strcpy(last, lb); }
                P(" %s", kc[i].nm);
              }
              P("\n");
            }

            P("\n=== framework lain yang dipakai (jumlah simbol per library) ===\n");
            for (i = 0; i < nfw; i++) P("  %-22s %d\n", fw[i].lib, fw[i].n);

            P("\n=== fungsi GL/EGL yang dipakai ===\n");
            P("  huruf: 1=libGLESv1_CM  2=libGLESv2  M=libmali  G=gl4es  (-=tidak ada)\n");
            for (i = 0; i < nusym; i++) {
              const char *n = usyms[i].name, *m = n + 1;
              int a, b, c, d;
              if (n[0] != '_' || (strncmp(m, "gl", 2) != 0 && strncmp(m, "egl", 3) != 0) || !(m[2] >= 'A' && m[2] <= 'Z') ) {
                if (!(strncmp(m, "egl", 3) == 0 && m[3] >= 'A' && m[3] <= 'Z')) continue;
              }
              a = h_gles1 && dlsym(h_gles1, m) != NULL; b = h_gles2 && dlsym(h_gles2, m) != NULL;
              c = h_mali && dlsym(h_mali, m) != NULL;   d = h_gl4es && dlsym(h_gl4es, m) != NULL;
              gl_total++; if (a || b || c || d) gl_any++; else gl_none++;
              P("  %c%c%c%c %s\n", a ? '1' : '-', b ? '2' : '-', c ? 'M' : '-', d ? 'G' : '-', m);
            }
            P("  ringkas: %d fungsi GL dipakai, %d ada di salah satu lib device, %d TIDAK ada\n", gl_total, gl_any, gl_none);
          }

          /* ---------------------------------------------------------------- metadata ObjC */
          static int vendor_class(const char *n) {
            static const char *pf[] = { "Flurry", "PH", "SBJson", "SDURL", "SDCached", "QueryComponents", "HardwareString", "OpenUDID", "__ARCLite", NULL };
            int i;
            for (i = 0; pf[i]; i++) if (!strncmp(n, pf[i], strlen(pf[i]))) return 1;
            return 0;
          }
          static int dump_methods(uint32_t ml, char tag, int show) {
            uint32_t entsize, count, i;
            if (!ml) return 0;
            entsize = R32(ml) & ~3u; count = R32(ml + 4);
            if (entsize < 12 || count > 4096) return 0;
            if (show) {
              for (i = 0; i < count && i < 200; i++) {
                uint32_t base = ml + 8 + i * entsize, imp = R32(base + 8);
                P("    %c %-46s imp=0x%08x%s\n", tag, vstr(R32(base)), imp & ~1u, (imp & 1) ? " (thumb)" : "");
              }
            }
            return (int)count;
          }
          static void dump_objc(int all) {
            const Sec *cl = find_sec("__objc_classlist"), *sr = find_sec("__objc_selrefs"), *mi = find_sec("__mod_init_func");
            uint32_t i, n, shown = 0, vend = 0;
            P("\n== ObjC + konstruktor ==\n");
            if (mi) {
              uint32_t k, cnt = mi->size / 4;
              P("  __mod_init_func: %u konstruktor statis (dijalankan loader sebelum masuk game)\n   ", cnt);
              for (k = 0; k < cnt && k < 8; k++) P(" 0x%08x", R32(mi->addr + 4 * k) & ~1u);
              P("%s\n", cnt > 8 ? " ..." : "");
            }
            if (sr) P("  selector refs: %u\n", sr->size / 4);
            if (!cl) { P("  tidak ada __objc_classlist\n"); return; }
            n = cl->size / 4;
            P("  kelas ObjC yang didefinisikan binary: %u (kelas vendor Flurry/PlayHaven/dll disembunyikan kecuali --all)\n", n);
            P("  catatan: IMP bit0=1 berarti Thumb. Nama method asli masih ada walau binary stripped -> titik masuk engine untuk Ghidra.\n");
            for (i = 0; i < n; i++) {
              uint32_t cva = R32(cl->addr + 4 * i), isa = R32(cva), sup = R32(cva + 4), ro = R32(cva + 16) & ~3u;
              uint32_t iro = R32(isa + 16) & ~3u;
              const char *name = vstr(R32(ro + 16)), *sname = "?";
              int ni, nc;
              if (vendor_class(name) && !all) { vend++; continue; }
              if (sup) { uint32_t k, m = cl->size / 4; for (k = 0; k < m; k++) { uint32_t o = R32(cl->addr + 4 * k); if (o == sup) { sname = vstr(R32(R32(o + 16) + 16)); break; } } }
              else { const char *b = bind_name_at(cva + 4); sname = b ? (strstr(b, "$_") ? strstr(b, "$_") + 2 : b) : "(root)"; }
              ni = dump_methods(R32(ro + 20), '-', 0); nc = dump_methods(R32(iro + 20), '+', 0);
              P("\n  @interface %s : %s   (instanceSize=%u, %d method instance, %d method kelas)\n", name, sname, R32(ro + 8), ni, nc);
              dump_methods(R32(iro + 20), '+', 1);
              dump_methods(R32(ro + 20), '-', 1);
              shown++;
            }
            P("\n  kelas ditampilkan=%u, kelas vendor disembunyikan=%u\n", shown, vend);
          }

          /* ---------------------------------------------------------------- .pvr */
          static void pvr_report(const char *path) {
            FILE *f = fopen(path, "rb"); uint8_t h[52]; uint32_t v[13]; const char *fmt = "?"; int pvrtc = 0;
            if (!f) { P("  %s: tidak bisa dibuka\n", path); return; }
            if (fread(h, 1, 52, f) != 52) { P("  %s: terlalu kecil\n", path); fclose(f); return; }
            fclose(f);
            memcpy(v, h, 52);
            if (memcmp(h + 44, "PVR!", 4) != 0) { P("  %s: bukan PVR v2 (magic tidak cocok)\n", path); return; }
            switch (v[4] & 0xff) {
            case 0x10: fmt = "RGBA4444"; break; case 0x11: fmt = "RGBA5551"; break; case 0x12: fmt = "RGBA8888"; break;
            case 0x13: fmt = "RGB565"; break; case 0x15: fmt = "RGB888"; break; case 0x18: fmt = "PVRTC 2bpp"; pvrtc = 1; break;
            case 0x19: fmt = "PVRTC 4bpp"; pvrtc = 1; break; case 0x1a: fmt = "BGRA8888"; break; default: break;
            }
            P("  %s: %ux%u mip=%u fmt=0x%02x (%s) bpp=%u data=%u B\n", path, v[2], v[1], v[3], v[4] & 0xff, fmt, v[6], v[5]);
            if (pvrtc) P("    -> PVRTC: Mali TIDAK mendukung GL_IMG_texture_compressed_pvrtc; decode ke RGBA8888 di shim glCompressedTexImage2D\n");
          }

          /* ---------------------------------------------------------------- main */
          int main(int argc, char **argv) {
            const char *bin = NULL, *repf = NULL, *pvr[16]; int npvr = 0, all = 0, i;
            struct utsname u; struct stat st; FILE *f;
            void *h_gles1, *h_gles2, *h_mali, *h_gl4es, *h_egl;

            for (i = 1; i < argc; i++) {
              if (!strcmp(argv[i], "--all")) all = 1;
              else if (!strcmp(argv[i], "--pvr") && i + 1 < argc && npvr < 16) pvr[npvr++] = argv[++i];
              else if (!bin) bin = argv[i];
              else if (!repf) repf = argv[i];
            }
            if (!bin) { fprintf(stderr, "pakai: %s <binary-mach-o> [report.txt] [--pvr file.pvr]... [--all]\n", argv[0]); return 2; }
            if (repf) rep = fopen(repf, "w");

            P("== machoprobe (Luxor 2 HD iOS, Milestone 1) ==\n");
            if (uname(&u) == 0) P("device: %s %s %s\n", u.sysname, u.release, u.machine);
            P("glibc: %s  sizeof(void*)=%u\n", gnu_get_libc_version(), (unsigned)sizeof(void *));

            dlopen("libm.so.6", RTLD_NOW | RTLD_GLOBAL);
            dlopen("libgcc_s.so.1", RTLD_NOW | RTLD_GLOBAL);
            dlopen("libstdc++.so.6", RTLD_NOW | RTLD_GLOBAL);
            dlopen("libBlocksRuntime.so.0", RTLD_NOW | RTLD_GLOBAL);

            P("\n== library grafik 32-bit di device ==\n");
            h_gles1 = try_open("/usr/lib32/libGLESv1_CM.so.1");
            h_gles2 = try_open("/usr/lib32/libGLESv2.so.2");
            h_mali  = try_open("/usr/lib32/libmali.so");
            h_egl   = try_open("/usr/lib32/libEGL.so.1");
            h_gl4es = try_open("/usr/lib32/gl4es/libGL.so.1");
            if (h_egl) P("  eglGetProcAddress: %s | eglGetDisplay: %s\n", dlsym(h_egl, "eglGetProcAddress") ? "ada" : "TIDAK", dlsym(h_egl, "eglGetDisplay") ? "ada" : "TIDAK");

            f = fopen(bin, "rb");
            if (!f || fstat(fileno(f), &st) != 0) { P("GAGAL membuka %s\n", bin); return 1; }
            DS = (size_t)st.st_size; D = malloc(DS);
            if (!D || fread(D, 1, DS, f) != DS) { P("GAGAL membaca %s\n", bin); return 1; }
            fclose(f);
            P("\nberkas: %s (%zu byte)\n", bin, DS);

            if (parse_macho() != 0) return 1;
            report_layout();
            report_env();
            classify(h_gles1, h_gles2, h_mali, h_gl4es);
            dump_objc(all);
            if (npvr) { P("\n== tekstur .pvr ==\n"); for (i = 0; i < npvr; i++) pvr_report(pvr[i]); }
            P("\n== machoprobe selesai ==\n");
            if (rep) fclose(rep);
            return 0;
          }
          EOF_C1
          cat > out/LuxorIpaProbe.sh <<'EOF_SH'
          #!/bin/bash
          # Probe Luxor 2 HD iOS (Milestone 1). Hanya membaca, tidak mengubah apa pun.
          # Folder data dicari seperti launcher PortMaster lain: /$directory/ports/<nama>

          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}

          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
            controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi

          source $controlfolder/control.txt
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"

          GAMEDIR="/$directory/ports/luxor2_ios"
          [ -d "$GAMEDIR" ] || GAMEDIR="$(cd "$(dirname "$0")" && pwd)/luxor2_ios"

          cd "$GAMEDIR" || {
            echo "folder luxor2_ios tidak ketemu. Dicari di: /$directory/ports/luxor2_ios dan di sebelah script ini." > "$(dirname "$0")/probe_error.txt"
            exit 1
          }

          export LD_LIBRARY_PATH="/usr/lib32:/lib32:${LD_LIBRARY_PATH}"
          chmod +x ./machoprobe 2>/dev/null

          echo "GAMEDIR=$GAMEDIR" > probe_stdout.txt
          if [ ! -f bin/luxor2 ]; then
            echo "bin/luxor2 belum ada di $GAMEDIR/bin (lihat TARUH-BINARY-DI-SINI.txt)" > probe_report.txt
            sleep 3
            exit 1
          fi

          PVRARGS=""
          for f in bin/*.pvr; do [ -f "$f" ] && PVRARGS="$PVRARGS --pvr $f"; done

          ./machoprobe bin/luxor2 probe_report.txt $PVRARGS >> probe_stdout.txt 2>&1
          echo "exit code: $?" >> probe_stdout.txt
          sleep 2
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF_SH
          cat > out/luxor2_ios/bin/TARUH-BINARY-DI-SINI.txt <<'EOF_TXT'
          Dari IPA (zip): ambil Payload/Luxor 2 HD.app/Luxor 2 HD, ganti nama jadi luxor2, taruh di folder ini.
          Opsional: salin 1-3 file .pvr dari folder data di dalam .app ke sini (misal vice.pvr) supaya format teksturnya ikut dicek.
          Jangan di-upload ke GitHub.
          EOF_TXT
          bash -n out/LuxorIpaProbe.sh

      - name: Kompilasi (armhf)
        run: |
          arm-linux-gnueabihf-gcc -O2 -Wall -Wextra -pie -fPIE -o out/luxor2_ios/machoprobe src/machoprobe.c -ldl
          file out/luxor2_ios/machoprobe || true
          echo "--- library yang dibutuhkan:"
          arm-linux-gnueabihf-readelf -d out/luxor2_ios/machoprobe | grep NEEDED
          B=machoprobe
          MAXV=$(arm-linux-gnueabihf-readelf -V out/luxor2_ios/$B | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "$B butuh GLIBC tertinggi: $MAXV (device: 2.37)"
          if [ "$(printf '%s\n%s\n' 2.37 "$MAXV" | sort -V | tail -1)" != "2.37" ]; then
            echo "GAGAL: $B butuh glibc lebih baru dari 2.37. Simbol penyebab:"
            arm-linux-gnueabihf-nm -D --undefined-only out/luxor2_ios/$B | grep -E 'GLIBC_2\.(3[89]|[4-9][0-9])'
            exit 1
          fi

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: luxor2-ios-probe-armhf
          path: out
